# 온프레미스(Ubuntu) 배포 구성: PostgreSQL + LXP 앱
# 사용법: .env 작성(.env.example 참고) 후  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LMS_DB_NAME:-lms}
      POSTGRES_USER: ${LMS_DB_USER:-lms}
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:?LMS_DB_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - lxp-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMS_DB_USER:-lms} -d ${LMS_DB_NAME:-lms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${LMS_HTTP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LMS_DB_HOST: db
      LMS_DB_NAME: ${LMS_DB_NAME:-lms}
      LMS_DB_USER: ${LMS_DB_USER:-lms}
      LMS_DB_PASSWORD: ${LMS_DB_PASSWORD:?}
      # AES-256 개인정보 암호화 키 — 분실 시 기존 데이터 복호화 불가, 반드시 백업
      LMS_CRYPTO_SECRET: ${LMS_CRYPTO_SECRET:?LMS_CRYPTO_SECRET 를 .env 에 설정하세요}
      # 미지정 시 첫 기동 때 무작위 생성되어 로그에 1회 출력됨
      LMS_ADMIN_INIT_PASSWORD: ${LMS_ADMIN_INIT_PASSWORD:-}
      # 운영 화면에 메모리 샘플 행이 노출되지 않도록 기본값을 명시적으로 OFF로 전달한다.
      LMS_DEMO_SAMPLE_DATA: ${LMS_DEMO_SAMPLE_DATA:-false}
      # AI(Claude) — 키가 없으면 AI 기능만 꺼진 채 뜬다. 앱 기동을 막지 않는다.
      #
      # 여기 값은 컨테이너 안으로 들어가는 환경변수다. 호스트의 .env 를 docker compose 가
      # 읽어 채운다 — .env 파일 자체는 .dockerignore 로 막혀 이미지에 들어가지 않는다.
      LMS_AI_ENABLED: ${LMS_AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LMS_AI_MODEL: ${LMS_AI_MODEL:-claude-sonnet-5}
      # 기본값은 application.yml 과 같게 유지한다. 여기만 다르면 로컬에서 되던 한도가
      # 운영에서 달라져 "왜 로컬이랑 다르지"로 시간을 버린다
      LMS_AI_DAILY_LIMIT: ${LMS_AI_DAILY_LIMIT:-200}
      LMS_AI_DAILY_LIMIT_PER_USER: ${LMS_AI_DAILY_LIMIT_PER_USER:-20}
      LMS_AI_MAX_TOKENS: ${LMS_AI_MAX_TOKENS:-600}
      LMS_AI_ADVICE_CACHE_HOURS: ${LMS_AI_ADVICE_CACHE_HOURS:-12}
      # 앞단 Cloudflare 터널이 100초에서 끊으므로 반드시 그보다 짧게
      LMS_AI_TIMEOUT: ${LMS_AI_TIMEOUT:-30s}
      # [기능 1] 채용공고 수집 — 키가 없으면 수집만 멈추고 앱은 뜬다
      LMS_JOB_ENABLED: ${LMS_JOB_ENABLED:-false}
      WORKNET_API_KEY: ${WORKNET_API_KEY:-}
      SARAMIN_ACCESS_KEY: ${SARAMIN_ACCESS_KEY:-}
      LMS_JOB_CRON: ${LMS_JOB_CRON:-0 0 3 * * MON}
    volumes:
      - lxp-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Cloudflare Tunnel — lms.samsungax.com 외부 공개 (docs/deploy-remote-2026-07-29.md)
  # 아웃바운드 연결이라 포트포워딩·방화벽 인바운드 불필요. 토큰 없으면 기동 실패(외부 공개 필수 전제).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 을 .env 에 설정하세요}
    depends_on:
      - app

volumes:
  lxp-dbdata:
  lxp-uploads:
