# local: PostgreSQL 없이 바로 실행 가능한 인메모리 H2 (PostgreSQL 호환 모드)
spring:
  datasource:
    url: jdbc:h2:mem:lms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

# 기존 로컬 화면 캡처/회귀 테스트 동작은 유지한다. 환경변수로 명시적으로 끌 수 있다.
lms:
  demo:
    sample-data: ${LMS_DEMO_SAMPLE_DATA:true}
