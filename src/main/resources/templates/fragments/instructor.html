<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  기존 강사 템플릿 호환 래퍼.
  실제 header/sidebar IA는 fragments/management.html 한 곳에서 관리한다.
-->
<body>
<header th:fragment="header(title)"
        th:replace="~{fragments/management :: header(${title})}"></header>

<th:block th:fragment="sidebar(active)">
    <th:block th:replace="~{fragments/management :: sidebar(${active})}"></th:block>
</th:block>

<!-- 기존 강사 예시 데이터 배너 계약 유지 -->
<div th:fragment="sampleNotice" class="sample-notice"
     style="display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:12px 16px;
            border:1px solid #cdd9ee;background:#eef3fb;border-radius:10px;
            color:#1c3d6e;font-size:14px;line-height:1.6;">
    <strong style="flex:none;padding:2px 8px;border-radius:6px;background:#1c3d6e;color:#fff;font-size:12px;">예시</strong>
    <span>담당 과정에 아직 배정된 항목이 없어 <strong>화면 예시용 샘플 데이터</strong>를 보여주고 있어요.
        실제 데이터가 등록되면 자동으로 바뀝니다.</span>
</div>
</body>
</html>
