<!DOCTYPE html>
<!-- ADMIN 도 이 화면을 쓰므로(관리자 사이드바 '콘텐츠 관리' → /instructor/contents) 역할에 따라 레이아웃을 분기한다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="isAdmin=${#authorization.expression('hasRole(''ADMIN'')')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css" th:href="${isAdmin} ? '/static/css/common-style.css' : '/static/css/i-common-style.css'">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css" th:href="${isAdmin} ? '/static/css/sidebar-style.css' : '/static/css/i-sidebar-style.css'">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/contents.css">
    <link rel="stylesheet" href="/static/css/content-library.css?v=20260825-1">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 콘텐츠 관리</title>
</head>
<body data-user-role="instructor" th:attr="data-user-role=${isAdmin} ? 'admin' : 'instructor'">
    <header th:replace="${isAdmin} ? ~{fragments/admin :: header('콘텐츠 관리 > 학습 콘텐츠(VOD/문서)')} : ~{fragments/instructor :: header('콘텐츠 관리 > 학습 콘텐츠(VOD/문서)')}"></header>
    <th:block th:replace="${isAdmin} ? ~{fragments/admin :: sidebar('contents')} : ~{fragments/instructor :: sidebar('contents')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <nav class="library-tabs" aria-label="콘텐츠 관리 메뉴">
                <a class="active" href="/instructor/contents">과정 콘텐츠</a>
                <a href="/instructor/content-library">공용 라이브러리</a>
                <a href="/instructor/content-library/versions">버전 이력</a>
            </nav>
            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>

            <!-- 과정 필터 + 등록 버튼 -->
            <div class="filter-section" style="margin-bottom:20px;">
                <form method="get" th:action="@{/instructor/contents}" class="filter-row" style="align-items:flex-end; gap:12px;">
                    <div>
                        <label>과정</label>
                        <select class="input" name="courseId" onchange="this.form.submit()">
                            <option value="">전체 과정</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"
                                    th:selected="${selectedCourseId != null and selectedCourseId == c.id}">과정명</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label>유형 필터</label>
                        <div class="tab-row" style="display:flex; gap:8px;">
                            <button type="button" class="tab-btn active" data-type="ALL">전체</button>
                            <button type="button" class="tab-btn" data-type="VIDEO">
                                <img src="/static/icons/content-video.png" alt="영상" style="width:28px;vertical-align:middle;margin-right:4px;">영상</button>
                            <button type="button" class="tab-btn" data-type="DOCUMENT">
                                <img src="/static/icons/content-document.png" alt="문서" style="width:28px;vertical-align:middle;margin-right:4px;">문서</button>
                        </div>
                    </div>
                    <a class="btn btn-secondary" th:href="@{/instructor/contents/new(type='VIDEO')}">+ 영상 등록</a>
                    <a class="btn btn-primary" th:href="@{/instructor/contents/new(type='DOCUMENT')}">+ 문서 등록</a>
                </form>
            </div>

            <div class="question-table-area">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:var(--gray-50);">
                            <th>유형</th>
                            <th>제목</th>
                            <th>과정</th>
                            <th>차시</th>
                            <th>길이/분량</th>
                            <th>필수</th>
                            <th>상태</th>
                            <th>등록일</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(contents)}">
                            <td colspan="9" style="text-align:center; color:var(--gray-500); padding:32px;">등록된 콘텐츠가 없습니다.</td>
                        </tr>
                        <tr th:each="c : ${contents}" th:id="'c' + ${c.id}" th:attr="data-type=${c.type}">
                            <td>
                                <img th:src="${c.type.name() == 'VIDEO'} ? '/static/icons/content-video.png' : '/static/icons/content-document.png'"
                                     alt="유형" style="width:30px;vertical-align:middle;margin-right:6px;">
                                <span th:text="${c.typeLabel}">유형</span>
                            </td>
                            <td th:text="${c.title}">제목</td>
                            <td th:text="${c.courseName}">과정</td>
                            <td th:text="${c.sessionName != null ? c.sessionName : '-'}">차시</td>
                            <td th:text="${c.durationLabel}">-</td>
                            <td th:text="${c.required} ? '필수' : '선택'">필수</td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${c.status.name() == 'ACTIVE'} ? 'status-in-progress' : 'status-disabled'"
                                      th:text="${c.statusLabel}">상태</span>
                            </td>
                            <td th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'yyyy-MM-dd') : '-'}">등록일</td>
                            <td style="white-space:nowrap;">
                                <a class="btn btn-secondary btn-sm" th:href="@{/instructor/contents/{id}/edit(id=${c.id})}">수정</a>
                                <form th:action="@{/instructor/content-library/promote/{id}(id=${c.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-secondary btn-sm">공용 원본으로 등록</button>
                                </form>
                                <form th:action="@{/instructor/contents/{id}/status(id=${c.id})}" method="post" style="display:inline;">
                                    <input type="hidden" name="courseId" th:value="${selectedCourseId}">
                                    <input type="hidden" name="status" th:value="${c.status.name() == 'ACTIVE'} ? 'ARCHIVED' : 'ACTIVE'">
                                    <button type="submit" class="btn btn-gray btn-sm"
                                            th:text="${c.status.name() == 'ACTIVE'} ? '비활성화' : '활성화'">상태</button>
                                </form>
                                <form th:action="@{/instructor/contents/{id}/delete(id=${c.id})}" method="post" style="display:inline;"
                                      onsubmit="return confirm('삭제하시겠습니까? (3년 보존 규정에 따라 기록은 남습니다)');">
                                    <input type="hidden" name="courseId" th:value="${selectedCourseId}">
                                    <button type="submit" class="btn btn-gray btn-sm">삭제</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 유형 탭 클라이언트 필터 (영상/문서/전체)
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                var type = btn.dataset.type;
                document.querySelectorAll('tbody tr[data-type]').forEach(function (tr) {
                    tr.style.display = (type === 'ALL' || tr.dataset.type === type) ? '' : 'none';
                });
            });
        });
    </script>
</body>
</html>
