<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 일정 관리</title>
    <style>
        .list-table { width:100%; border-collapse:collapse; background:#fff; }
        .list-table th, .list-table td { border-bottom:1px solid var(--gray-200); padding:12px 14px; font-size:14px; text-align:left; }
        .list-table th { color:var(--gray-500); font-weight:600; background:var(--gray-50); }
        .empty-hint { color:var(--gray-500); font-size:14px; padding:24px; text-align:center; }
        .course-select-bar { display:flex; align-items:center; gap:10px; margin:16px 0; }
        .course-select-bar select { padding:8px 12px; border:1px solid var(--gray-300); border-radius:8px; font-size:14px; min-width:320px; }
        .date-cell { font-weight:600; color:#1c6dd0; white-space:nowrap; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/instructor :: header('담당 과정 &gt; 일정 관리')}"></header>
    <th:block th:replace="~{fragments/instructor :: sidebar('scheduler')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div th:replace="${sampleData} ? ~{fragments/instructor :: sampleNotice} : ~{}"></div>

            <div class="section-header"><h2>일정 관리</h2></div>

            <!-- 과정 선택 (담당 과정 한정) -->
            <form class="course-select-bar" method="get" action="/instructor/scheduler">
                <label for="courseId">과정 선택</label>
                <select id="courseId" name="courseId" onchange="this.form.submit()">
                    <option th:if="${#lists.isEmpty(courseOptions)}" value="">담당 과정 없음</option>
                    <option th:each="opt : ${courseOptions}"
                            th:value="${opt.id}"
                            th:selected="${opt.id == selectedCourseId}"
                            th:text="|${opt.courseName} (${opt.courseCode})|">과정</option>
                </select>
            </form>

            <!-- 차시 lessonDate 기반 일정 목록 -->
            <table class="list-table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>시작</th>
                        <th>과목</th>
                        <th>차시</th>
                        <th>차시명</th>
                        <th>학습시간</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${schedule}">
                        <td class="date-cell" th:text="${item.lessonDate}">2026-01-01</td>
                        <td th:text="${item.lessonStartTime != null ? item.lessonStartTime : '미정'}">09:00</td>
                        <td th:text="${item.subjectName}">과목</td>
                        <td th:text="|${item.seq}차시|">1차시</td>
                        <td th:text="${item.sessionName}">차시명</td>
                        <td th:text="${item.learningMinutes} != null ? |${item.learningMinutes}분| : '-'">-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(schedule)}">
                        <td colspan="6" class="empty-hint">일정(날짜 지정 차시)이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
