<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:with="isAdmin=${#authorization.expression('hasRole(''ADMIN'')')}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/i-common-style.css" th:href="${isAdmin} ? '/static/css/common-style.css' : '/static/css/i-common-style.css'">
    <link rel="stylesheet" href="/static/css/i-sidebar-style.css" th:href="${isAdmin} ? '/static/css/sidebar-style.css' : '/static/css/i-sidebar-style.css'">
    <link rel="stylesheet" href="/static/css/content-library.css?v=20260825-1">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 콘텐츠 라이브러리</title>
</head>
<body data-user-role="instructor" th:attr="data-user-role=${isAdmin} ? 'admin' : 'instructor'">
<header th:replace="${isAdmin} ? ~{fragments/admin :: header('콘텐츠 관리 > 공용 라이브러리')} : ~{fragments/instructor :: header('콘텐츠 관리 > 공용 라이브러리')}"></header>
<th:block th:replace="${isAdmin} ? ~{fragments/admin :: sidebar('content-library')} : ~{fragments/instructor :: sidebar('content-library')}"/>
<main class="main-content">
    <div class="library-shell">
        <nav class="library-tabs" aria-label="콘텐츠 관리 메뉴">
            <a href="/instructor/contents">과정 콘텐츠</a>
            <a class="active" href="/instructor/content-library">공용 라이브러리</a>
            <a href="/instructor/content-library/versions">버전 이력</a>
        </nav>

        <div class="library-hero">
            <div>
                <span class="library-eyebrow">CONTENT LIBRARY</span>
                <h1>한 번 만든 콘텐츠를<br>여러 과정에서 관리하세요</h1>
                <p>공용 원본을 과정과 차시에 연결하면 새 버전 발행 시 연결된 학습 콘텐츠가 자동으로 최신화됩니다.</p>
            </div>
            <div class="library-actions">
                <a class="library-btn" href="/instructor/content-library/new?type=DOCUMENT">문서 원본 등록</a>
                <a class="library-btn primary" href="/instructor/content-library/new?type=VIDEO">영상 원본 등록</a>
            </div>
        </div>

        <div class="library-flash" th:if="${message}" th:text="${message}">완료 메시지</div>

        <section class="library-stats" aria-label="라이브러리 운영 요약">
            <div class="library-stat"><span>공용 원본</span><strong th:text="${dashboard.itemCount}">0</strong></div>
            <div class="library-stat"><span>사용 가능</span><strong th:text="${dashboard.publishedCount}">0</strong></div>
            <div class="library-stat"><span>과정 연결</span><strong th:text="${dashboard.linkedContentCount}">0</strong></div>
            <div class="library-stat"><span>누적 버전</span><strong th:text="${dashboard.versionCount}">0</strong></div>
        </section>

        <form class="library-filter" method="get" action="/instructor/content-library">
            <div class="library-field">
                <label for="keyword">원본 검색</label>
                <input class="library-input" id="keyword" name="keyword" th:value="${keyword}" placeholder="제목, 설명, 산업·직무 태그">
            </div>
            <div class="library-field">
                <label for="type">유형</label>
                <select class="library-select" id="type" name="type">
                    <option value="">전체 유형</option>
                    <option th:each="option : ${contentTypes}" th:value="${option}" th:text="${option.label}"
                            th:selected="${selectedType == option}">유형</option>
                </select>
            </div>
            <div class="library-field">
                <label for="status">상태</label>
                <select class="library-select" id="status" name="status">
                    <option value="">전체 상태</option>
                    <option th:each="option : ${libraryStatuses}" th:value="${option}" th:text="${option.label}"
                            th:selected="${selectedStatus == option}">상태</option>
                </select>
            </div>
            <button class="library-btn primary" type="submit">검색</button>
        </form>

        <section class="library-panel library-table-wrap">
            <table class="library-table">
                <thead><tr><th>원본</th><th>현재 버전</th><th>연결 과정</th><th>자동 반영</th><th>상태</th><th>최근 수정</th><th>관리</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(items)}"><td class="library-empty" colspan="7">조건에 맞는 공용 콘텐츠가 없습니다.</td></tr>
                <tr th:each="item : ${items}">
                    <td class="title-cell">
                        <strong><span class="library-badge" th:text="${item.typeLabel}">유형</span> <span th:text="${item.title}">제목</span></strong>
                        <small th:text="${item.industryTags != null ? item.industryTags : (item.description != null ? item.description : item.originalFileName)}">설명</small>
                    </td>
                    <td><strong th:text="'v' + ${item.currentVersion}">v1</strong></td>
                    <td th:text="${item.linkedContentCount} + '건'">0건</td>
                    <td th:text="${item.autoSyncCount} + '건'">0건</td>
                    <td><span class="library-badge" th:classappend="${item.status == 'ARCHIVED'} ? ' muted'" th:text="${item.statusLabel}">상태</span></td>
                    <td th:text="${item.updatedAt != null ? #temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td><div class="library-actions"><a class="library-btn small" th:href="@{/instructor/content-library/{id}(id=${item.id})}">상세</a><a class="library-btn small primary" th:href="@{/instructor/content-library/{id}/deploy(id=${item.id})}">과정에 배치</a></div></td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
