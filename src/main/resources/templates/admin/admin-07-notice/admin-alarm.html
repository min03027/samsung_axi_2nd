<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 추가적인 페이지별 스타일은 여기에 작성 */
    </style>
</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('공지/알림 > 알림 관리')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('alarm')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="main-content-inner">

            <!-- 필터 영역 -->
        <form class="filter-section" method="get" th:action="@{/admin/notice/alarms}">
                <div class="filter-row">
                    <div>
                        <!-- 알림에는 공지 분류가 없다. 이 셀렉트는 중요도 필터로 쓴다 (NotificationSearchCond). -->
                        <label>중요도</label>
                    <select id="courseFilter" name="priority">
                        <option value="">전체</option>
                        <option value="high" th:selected="${cond.priority == 'high'}">높음</option>
                        <option value="normal" th:selected="${cond.priority == 'normal'}">중간</option>
                        <option value="low" th:selected="${cond.priority == 'low'}">낮음</option>
                        <option value="urgent" th:selected="${cond.priority == 'urgent'}">긴급</option>
                    </select>
                </div>
                <div>
                    <label>등록일</label>
                    <select id="dateFilter" name="dateFilter">
                        <option value="">전체</option>
                        <option value="today">오늘</option>
                        <option value="this-week">이번 주</option>
                        <option value="this-month">이번 달</option>
                        <option value="custom">직접 선택</option>
                    </select>
                </div>
                <div id="customDateRange" style="display: none;">
                    <input type="date" id="startDate" name="startDate">
                    <span style="margin: 0 4px;">~</span>
                    <input type="date" id="endDate" name="endDate">
                </div>
                <div class="filter-item">
                    <label>검색</label>
                    <input type="text" id="searchInput" name="keyword" th:value="${cond.keyword}" placeholder="알림 제목, 내용으로 검색">
                </div>
                <button class="btn btn-secondary" type="submit">
                    검색하기
                </button>
                <button class="btn btn-primary" type="button" onclick="window.open('/admin/notice/alarms/new','alarmAddModal','width=520,height=600,scrollbars=yes,resizable=no');" style="width: 130px; height: 38px;">
                    <span>+</span>
                    <span>새 알람 등록</span>
                </button>
            </div>
        </form>
        
        <!-- 학습 위험 알림 -->

        <section>
            <h2 style="font-size:20px;font-weight:700;margin-bottom:14px;">학습 위험 알림</h2>
            <div id="aiAlarmList" style="display:flex;gap:18px;flex-wrap:nowrap;overflow-x:auto;"></div>
        </section>
        
        <div class="divider"></div>
        
        <!-- 알림 내용 -->
        <section>
            <h2 style="font-size:20px;font-weight:700;margin-bottom:14px;">알림 내역</h2>
            <div style="overflow-x:auto;">
                <table class="history-table table-history" style="width:100%;min-width:900px;border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f7f7f7;">
                            <th style="width:40px;"><input type="checkbox" onclick="toggleAllAlarmCheckboxes(this)"></th>
                            <th style="width:90px;">상태</th>
                            <th style="width:60px;">번호</th>
                            <th style="width:180px;">제목</th>
                            <th style="width:320px;">내용</th>
                            <th style="width:120px;">날짜</th>
                            <th style="width:90px;">중요도</th>
                            <th style="width:110px;">작성자</th>
                            <th style="width:90px;">수신/읽음</th>
                            <th style="width: 40px;">상세보기</th>
                        </tr>
                    </thead>
                    <tbody id="alarmTableBody">
                        <tr th:each="row : ${rows}">
                            <td><input type="checkbox" class="alarm-checkbox" name="ids" th:value="${row.id}" form="alarmBulkForm"></td>
                            <td>
                                <span th:text="${row.status}" style="font-weight:600;">발송완료</span><br>
                                <span th:text="${row.aggregateReadStatus()}"
                                      th:style="${row.readCount > 0} ? 'color:var(--color-primary);font-weight:600;' : 'color:var(--color-danger);font-weight:600;'">읽음 현황</span>
                            </td>
                            <td th:text="${row.id}">1</td>
                            <td th:text="${row.title}">제목</td>
                            <td class="alarm-content-cell" tabindex="0" th:title="${row.content}">
                                <span class="alarm-content-inner" th:text="${row.content}">내용</span>
                            </td>
                            <td th:text="${row.date}">2026-01-01</td>
                            <td th:text="${row.importance}">높음</td>
                            <td th:text="${row.author}">관리자</td>
                            <td th:text="${row.recipientCount} + ' / ' + ${row.readCount}">0 / 0</td>
                            <td>
                                <button class="btn btn-secondary" type="button"
                                        th:attr="onclick=|window.open('/admin/notice/alarms/${row.id}','alarmDetailModal','width=520,height=600,scrollbars=yes,resizable=no');|">상세보기</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rows)}"><td colspan="10">등록된 알림이 없습니다.</td></tr>
                    </tbody>
                </table>
                <!-- 선택삭제/읽음처리는 같은 체크박스를 공유한다. form 속성으로 테이블 밖 폼에 붙였다. -->
                <form id="alarmBulkForm" method="post" th:action="@{/admin/notice/alarms/delete}"
                      style="display:flex;gap:10px;justify-content:flex-start;margin:18px 0 0 0;">
                    <button class="btn btn-gray" id="btnDeleteSelected" type="submit" data-user-role="admin"
                            th:formaction="@{/admin/notice/alarms/delete}">선택삭제</button>
                    <button class="btn btn-gray" id="btnMarkRead" type="submit"
                            th:formaction="@{/admin/notice/alarms/read}">읽음처리</button>
                </form>
                <div class="pagination">
                    <div class="page-info">

                        <!--

                          0건일 때 "1 / 1 페이지 (총 0건)" 이 나오던 것을 고쳤다.

                          컨트롤러가 totalPages 를 Math.max(...,1) 로 강제해 0건에도 1페이지가 있는 것처럼

                          보였다. 결과가 없으면 페이지 수를 말하지 않는다 — 앞뒤가 안 맞는 숫자는

                          "화면이 깨졌나" 로 읽힌다.

                        -->

                        <span th:if="${totalCount > 0}">

                            <span th:text="${currentPage}">1</span> / <span th:text="${totalPages}">1</span> 페이지

                            (총 <span th:text="${totalCount}">0</span>건)

                        </span>

                        <span th:if="${totalCount == 0}">결과가 없습니다</span>

                    </div>
                    <!-- 페이지가 하나뿐이면 버튼을 그리지 않는다. 누를 수 없는 "1" 만 남으면 고장으로 보인다 -->
                    <div class="pagination-controls" th:if="${totalPages > 1}">
                        <a th:each="p : ${#numbers.sequence(1, totalPages)}"
                           th:href="@{/admin/notice/alarms(page=${p},priority=${cond.priority},keyword=${cond.keyword})}"
                           th:text="${p}" th:classappend="${p == currentPage} ? 'active'">1</a>
                    </div>
                </div>
            </div>
        </section>
        <style>
        .table-history th, .table-history td {
            border-bottom:1px solid var(--gray-200);
            padding:10px 8px;
            text-align:left;
            background:#fff;
        }
        .table-history tbody tr:hover {
            background:#f3f8ff;
        }
        .table-history .alarm-content-cell {
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: box-shadow 0.2s, background 0.2s;
            position: relative;
            cursor: pointer;
        }
        .table-history tbody tr:hover .alarm-content-cell {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08) inset;
            background: #eaf3ff;
        }
        .alarm-content-cell .alarm-content-inner {
            display: inline-block;
            white-space: nowrap;
            transition: transform 3.5s linear;
        }
        </style>
        <script>
        // 더미 alarmHistory / renderAlarmTable 제거 — tbody 는 Thymeleaf 가 서버에서 렌더한다.

        function addAlarmContentScrollAnimation() {
            const cells = document.querySelectorAll('.alarm-content-cell');
            cells.forEach(cell => {
                let inner = cell.querySelector('.alarm-content-inner');
                cell.addEventListener('mouseenter', () => {
                    // reset
                    inner.style.transition = 'none';
                    inner.style.transform = 'translateX(0)';
                    // 다음 프레임에 애니메이션 적용
                    setTimeout(() => {
                        const cellWidth = cell.offsetWidth;
                        const textWidth = inner.scrollWidth;
                        if (textWidth > cellWidth) {
                            const distance = textWidth - cellWidth;
                            inner.style.transition = 'transform 3.5s linear';
                            inner.style.transform = `translateX(-${distance}px)`;
                        }
                    }, 30);
                });
                cell.addEventListener('mouseleave', () => {
                    inner.style.transition = 'transform 0.5s';
                    inner.style.transform = 'translateX(0)';
                });
            });
        }

        function toggleAllAlarmCheckboxes(master) {
            const checkboxes = document.querySelectorAll('.alarm-checkbox');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        // DOMContentLoaded 시 테이블 렌더 + 애니메이션 이벤트 연결
        document.addEventListener('DOMContentLoaded', () => {
            addAlarmContentScrollAnimation();
        });
        </script>
        
        
    </div>
    </main>

    <script>
        /*
         * 학습 위험 알림 — 서버가 내려주는 실제 위험 건만 표시한다.
         * window._serverRiskAlarms 를 채우는 컨트롤러가 생기기 전까지는 빈 상태로 두고,
         * 위험도 분석은 이탈 예측 대시보드(/admin/analytics/dropout)로 안내한다.
         * (예시 이름·과정으로 채우지 않는다 — 실데이터로 오해되면 잘못된 개입을 부른다.)
         */
        function renderRiskAlarms() {
            const list = document.getElementById('aiAlarmList');
            if (!list) return;
            const alarms = window._serverRiskAlarms || [];
            if (alarms.length === 0) {
                list.innerHTML = `
                    <div style="flex:1;background:var(--white);border:1px dashed var(--gray-300);border-radius:12px;
                                padding:22px 24px;color:var(--gray-600);font-size:14px;line-height:1.6;">
                        현재 발생한 학습 위험 알림이 없습니다.<br>
                        과정별 이탈 위험도는 <a href="/admin/analytics/dropout" style="color:var(--color-primary);font-weight:600;">이탈 예측 대시보드</a>에서 확인할 수 있습니다.
                    </div>
                `;
                return;
            }
            list.innerHTML = alarms.map(alarm => {
                const color = alarm.metric.includes('출석') ? 'var(--color-danger)' : 'var(--color-warning)';
                const title = alarm.type === 'student' ? '출석/수강률 위험 학습자' : '위험 과정';
                const subject = alarm.type === 'student'
                    ? `<span style="font-weight:500;">${alarm.name}</span> (${alarm.course})`
                    : `<span style="font-weight:500;">${alarm.course}</span>`;
                return `
                    <div style="min-width:320px;max-width:420px;background:var(--white);border-radius:12px;padding:24px 22px 18px 22px;box-shadow:0 2px 12px rgba(0,0,0,0.07);margin-bottom:18px;">
                        <div style="font-size:17px;font-weight:600;margin-bottom:10px;">${title}</div>
                        <div>${subject} - ${alarm.metric} <span style="color:${color};font-weight:700;">${alarm.value}%</span></div>
                    </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', renderRiskAlarms);
    </script>
</body>
</html>
