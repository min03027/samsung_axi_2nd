<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* admin-notice의 notice-table 스타일 참고 */
        .notice-table {
            width: 100%;
            border-collapse: collapse;
        }
        .notice-table th, .notice-table td {
            border: 1px solid var(--gray-200);
            padding: 12px 16px;
            text-align: center;
        }
        .notice-table th {
            background: var(--gray-50);
            font-weight: 700;
            color: var(--gray-800);
        }
        .notice-table td {
            font-size: 15px;
            color: var(--gray-800);
        }
        .notice-table td a {
            color: var(--color-primary);
            text-decoration: none;
        }
        .notice-table td a:hover {
            text-decoration: underline;
        }

        .notice-detail-content {
            width: 100%;
            flex: 1;
            min-height: 300px;
            white-space: pre-line;
            padding: 18px;
            background: #fff;
            border: 1px solid var(--gray-100);
            border-radius: 8px;
        }
        textarea.notice-detail-content {
            resize: none; /* 사용자가 크기 조절 못하게 함 */
            overflow: auto;
        }
        
        .notice-board-section{
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .notice-detail-footer{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
</style>
</head>
<body>
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('공지/알림 > 공지 등록')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('notice')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 훈련생 관리 -->
        <section class="main-content-inner">
            <form class="notice-board-section" method="post"
                  th:action="${form.id == null} ? @{/admin/notice} : @{/admin/notice/{id}(id=${form.id})}">
                <input type="hidden" name="id" th:value="${form.id}">
                <table class="notice-table">
                    <colgroup>
                        <col style="width: 6%;">
                        <col style="width: 8%;">
                        <col style="width: 6%;">
                        <col style="width: 12%;">
                        <col style="width: 6%;">
                        <col style="width: 14%;">
                        <col style="width: 6%;">
                        <col style="width: 14%;">
                        <col style="width: 6%;">
                        <col style="width: 10%;">
                        <col style="width: 6%;">
                        <col style="width: 6%;">
                    </colgroup>
                    <tbody>
                        <tr>
                            <th colspan="12">
                                <input id="noticeTitle" name="title" th:value="${form.title}" type="text" placeholder="공지 제목을 입력하세요" style="background-color: transparent; font-size: 24px;"/>
                            </th>
                        </tr>
                        <tr>
                            <th>번호</th>
                            <td id="noticeId" th:text="${form.id ?: '-'}"></td>
                            <th>작성자</th>
                            <td id="noticeAuthor"></td>
                            <th>작성일</th>
                            <td id="noticeDate"></td>
                            <th>수정일</th>
                            <td id="noticeEditDate"></td>
                            <th>수정자</th>
                            <td id="noticeEditor"></td>
                            <th>조회수</th>
                            <td id="noticeViews"></td>
                        </tr>
                        <!-- 첨부파일 -->
                        <tr>
                            <th>첨부파일</th>
                            <td colspan="11" style="text-align: start;">
                            <label>카테고리 <select name="categoryId"><option value="">선택 안 함</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == form.categoryId}">일반</option></select></label>
                            <label>과정 <select name="courseId"><option value="">전체 공지</option><option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseName}" th:selected="${course.id == form.courseId}">과정</option></select></label>
                            <label><input type="checkbox" name="pinned" th:checked="${form.pinned}"> 상단 고정</label>
                            <label><input type="checkbox" name="published" th:checked="${form.published}"> 게시</label>
                            <label><input type="checkbox" name="popupOnLogin" th:checked="${form.popupOnLogin}"> 로그인 팝업</label>
                            <label><input type="checkbox" name="emailNotify" th:checked="${form.emailNotify}"> 게시 즉시 이메일</label>
                            </td>
                        </tr>
                    </tbody>
                </table>

                        
                <textarea class="notice-detail-content" id="noticeContent" name="content" th:text="${form.content}" placeholder="공지사항 본문을 입력하세요"></textarea>

                

                <div class="notice-detail-footer">
                    <a class="btn btn-gray" th:href="@{/admin/notice}" style="padding: 12px 40px; font-size: 16px;">돌아가기</a>
                    <div>
                        <button type="submit" class="btn btn-save" style="padding: 12px 40px; font-size: 16px;">저장하기</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script>
        // 바인딩 스크립트: query param 'id'가 있으면 서버에서 공지 데이터를 가져와 폼에 채웁니다.
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function bindNoticeToForm(notice) {
            if (!notice) return;
            const titleInput = document.getElementById('noticeTitle');
            if (titleInput && titleInput.tagName === 'INPUT') titleInput.value = notice.title || '';

            const setText = (id, value) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.textContent = value != null ? value : '';
            };

            setText('noticeId', notice.id ?? '');
            setText('noticeAuthor', notice.author ?? '');
            setText('noticeDate', notice.date ?? '');
            setText('noticeEditDate', notice.editDate ?? '');
            setText('noticeEditor', notice.editor ?? '');
            setText('noticeViews', notice.views ?? 0);

            // attachments
            const attDiv = document.getElementById('noticeAttachments');
            if (attDiv) {
                if (Array.isArray(notice.attachments) && notice.attachments.length) {
                    attDiv.innerHTML = notice.attachments.map(a => {
                        const name = a.name || a.filename || '첨부파일';
                        const url = a.url || a.path || '#';
                        return `<a href="${url}" download>${name}</a>`;
                    }).join(', ');
                } else {
                    attDiv.textContent = '없음';
                }
            }

            // content
            const contentEl = document.getElementById('noticeContent');
            if (contentEl) {
                if (contentEl.tagName === 'TEXTAREA' || contentEl.tagName === 'INPUT') {
                    contentEl.value = notice.content ?? '';
                } else {
                    contentEl.textContent = notice.content ?? '';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 우선 전역으로 주입된 초기 데이터가 있는지 확인
            let notice = window.__initialNoticeData || null;

            const id = getQueryParam('id');
            if (!notice && id) {
                try {
                    const res = await fetch(`/api/notices/${encodeURIComponent(id)}`);
                    if (res.ok) notice = await res.json();
                } catch (err) {
                    console.warn('공지 데이터를 불러오지 못했습니다.', err);
                }
            }

            // 바인딩 실행
            bindNoticeToForm(notice);
        });
    </script>
</body>
</html>
