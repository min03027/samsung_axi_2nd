<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/attendance.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 출결현황</title>
    <style>
        .toolbar { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
        .toolbar label { display:block; font-size:13px; font-weight:600; color:var(--gray-500); margin-bottom:4px; }
        .toolbar select { padding:8px 12px; border:1px solid var(--gray-300); border-radius:8px; min-width:280px; }
        .flash-msg { background:#e7f6ec; color:#1b7a3d; border:1px solid #b6e0c4; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
        .matrix-wrap { overflow-x:auto; }
        table.att-matrix { border-collapse:collapse; width:100%; font-size:13px; }
        table.att-matrix th, table.att-matrix td { border:1px solid var(--gray-200); padding:8px 10px; text-align:center; white-space:nowrap; }
        table.att-matrix th { background:var(--gray-50); color:var(--gray-600); font-weight:600; }
        table.att-matrix td.name-cell, table.att-matrix th.name-cell { text-align:left; position:sticky; left:0; background:#fff; z-index:1; font-weight:600; }
        .att-badge { display:inline-block; min-width:44px; padding:3px 8px; border-radius:10px; font-size:12px; font-weight:600; }
        .att-PRESENT { background:var(--color-success-bg); color:var(--color-success); }
        .att-LATE    { background:var(--color-warning-bg); color:var(--color-warning); }
        .att-ABSENT  { background:var(--color-danger-bg); color:var(--color-danger); }
        .att-EXCUSED { background:#e2e3ff; color:#3730a3; }
        .att-NONE    { color:var(--gray-500); }
        .rate-cell { font-weight:700; }
        .empty-hint { color:var(--gray-500); font-size:14px; padding:24px 0; }
        .override-form { display:inline-flex; gap:4px; align-items:center; }
        .override-form select { padding:2px 4px; font-size:11px; border:1px solid var(--gray-300); border-radius:6px; }
        .override-form button { padding:2px 6px; font-size:11px; }
        details.cell-edit summary { cursor:pointer; list-style:none; }
        details.cell-edit[open] summary { margin-bottom:4px; }
        .feature-shortcuts { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:22px; padding:18px 20px; border:1px solid var(--gray-200); border-radius:12px; background:var(--gray-50); }
        .feature-shortcuts p { margin:4px 0 0; color:var(--gray-500); font-size:14px; }
        .feature-shortcuts-actions { display:flex; flex-wrap:wrap; gap:8px; }
        @media (max-width:900px) { .feature-shortcuts { align-items:flex-start; flex-direction:column; } }
    </style>
</head>
<body data-user-role="admin">
    <header th:replace="~{fragments/admin :: header('출결/이수 관리 > 출결현황')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('att-status')}"/>

    <main class="main-content">
        <section class="main-content-inner">
            <div class="section-header">
                <h2>출결현황</h2>
            </div>

            <div class="feature-shortcuts">
                <div>
                    <strong>출결·실시간 학습 운영 데모</strong>
                    <p>전송 상태, 학습 참여, 라이브 강의를 각 운영 화면에서 확인할 수 있습니다.</p>
                </div>
                <div class="feature-shortcuts-actions">
                    <a class="btn btn-gray" href="/v2/admin/attendance.html">출결·HRD 전송</a>
                    <a class="btn btn-gray" href="/v2/admin/presence-monitor.html">학습 참여 모니터링</a>
                    <a class="btn btn-primary" href="/v2/admin/live-class-monitor.html">라이브 강의 모니터링</a>
                </div>
            </div>

            <p class="flash-msg" th:if="${message}" th:text="${message}"></p>

            <!-- 과정 선택 + 재산정 -->
            <form class="toolbar" method="get" th:action="@{/admin/attendance}">
                <div>
                    <label for="courseSelect">과정 선택</label>
                    <select id="courseSelect" name="courseId" onchange="this.form.submit()">
                        <option th:each="c : ${courses}" th:value="${c.id}"
                                th:selected="${selectedCourse != null and c.id == selectedCourse.id}"
                                th:text="|${c.courseName} (${c.courseCode}${c.cohort != null ? ' / ' + c.cohort : ''})|">과정</option>
                    </select>
                </div>
            </form>

            <div th:if="${selectedCourse != null}" style="margin-bottom:16px;">
                <form method="post" th:action="@{/admin/attendance/recalculate}" style="display:inline;">
                    <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                    <button type="submit" class="btn btn-primary">접속 로그로 출결 재산정</button>
                </form>
                <span class="empty-hint" style="padding:0 0 0 8px;">
                    일정(진행일)이 지정된 차시만 산정됩니다. 해당 일자에 로그인 이력이 있으면 출석 처리됩니다.
                </span>
            </div>

            <!-- 출결 매트릭스 -->
            <div class="attendance-info-section" th:if="${selectedCourse != null}">
                <p class="empty-hint" th:if="${matrix == null or matrix.empty}">
                    산정된 출결이 없습니다. 일정이 지정된 차시와 승인된 수강생이 있는지 확인 후 재산정하세요.
                </p>
                <div class="matrix-wrap" th:unless="${matrix == null or matrix.empty}">
                    <table class="att-matrix">
                        <thead>
                            <tr>
                                <th class="name-cell">훈련생</th>
                                <th th:each="col : ${matrix.columns}"
                                    th:title="${col.date}"
                                    th:text="|${col.seq}차시|">차시</th>
                                <th>출석률</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${matrix.rows}">
                                <td class="name-cell" th:text="${row.traineeName}">훈련생</td>
                                <td th:each="cell : ${row.cells}">
                                    <span th:if="${!cell.recorded}" class="att-badge att-NONE">-</span>
                                    <details class="cell-edit" th:if="${cell.recorded}">
                                        <summary>
                                            <span class="att-badge" th:classappend="'att-' + ${cell.status}"
                                                  th:text="${cell.label}">상태</span>
                                        </summary>
                                        <form class="override-form" method="post"
                                              th:action="@{/admin/attendance/{id}/override(id=${cell.attendanceId})}">
                                            <input type="hidden" name="courseId" th:value="${selectedCourse.id}">
                                            <select name="status">
                                                <option th:each="s : ${statuses}" th:value="${s}"
                                                        th:selected="${s.name() == cell.status}"
                                                        th:text="${s.label}">상태</option>
                                            </select>
                                            <button type="submit" class="btn btn-gray">저장</button>
                                        </form>
                                    </details>
                                </td>
                                <td class="rate-cell" th:text="|${row.attendanceRate}%|">0%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <p class="empty-hint" th:if="${selectedCourse == null}">등록된 과정이 없습니다.</p>
        </section>
    </main>
</body>
</html>
