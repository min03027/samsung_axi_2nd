<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/courses.css">

    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('과정/운영 관리 > 과정 관리')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('courses')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner">
            <!-- 상단 통계 카드 영역 -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-info">
                        <div class="stat-label">전체 과정수</div>
                        <div class="stat-value"><span th:text="${totalCount}">0</span><span class="stat-unit">개</span></div>
                    </div>
                </div>
                <div class="stat-card stat-card-wide">
                    <div class="stat-info">
                        <div class="stat-label">진행중</div>
                        <div class="stat-value status-active"><span th:text="${inProgressCount}">0</span>개</div>
                    </div>
                    <div class="stat-info">
                        <div class="stat-label">모집중</div>
                        <div class="stat-value status-recruiting"><span th:text="${recruitingCount}">0</span>개</div>
                    </div>
                </div>

                <!-- 과정 추가하기 -->
                <div class="stat-card stat-card-action" onclick="location.href='/admin/courses/new'">
                    <div class="add-course-content">
                        <img src="/static/icons/add.svg" alt="add icon" class="add-icon">
                        <div class="add-text">과정 추가하기</div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 하단 메인 콘텐츠 영역 -->
            <div class="content-container">
                <div class="table-section">
                    <!-- 과정 카드 그리드 (서버 렌더링) -->
                    <div class="course-grid">
                        <div class="course-card" th:each="course : ${courses}"
                             th:onclick="|location.href='/admin/courses/${course.id}'|">
                            <div class="course-top-section" onclick="event.stopPropagation()">
                                <span class="course-category badge-kdt" th:text="${course.category} ?: '미분류'">카테고리</span>
                            </div>
                            <div class="course-header">
                                <h3 class="course-title" th:text="${course.courseName}">과정명</h3>
                                <span class="instructor-name" th:text="${course.cohort} ?: ''">기수</span>
                            </div>
                            <div class="course-stats">
                                <div class="stat-box">
                                    <span class="stat-text">과목 <strong th:text="${subjectCounts.get(course.id)}">0</strong>개</span>
                                </div>
                                <div class="divider-vertical"></div>
                                <div class="stat-box">
                                    <span class="stat-text">정원 <strong th:text="${course.capacity}">0</strong>명</span>
                                </div>
                                <div class="divider-vertical"></div>
                                <div class="stat-box">
                                    <span class="stat-text">코드 <strong th:text="${course.courseCode}">-</strong></span>
                                </div>
                            </div>
                            <div class="course-progress-info">
                                <div class="progress-left">
                                    <span class="status-badge" th:text="${course.status.label}">상태</span>
                                    <span class="progress-period"
                                          th:text="|📅 ${course.startDate} ~ ${course.endDate}|">기간</span>
                                </div>
                            </div>
                        </div>

                        <!-- 등록된 과정이 없을 때 -->
                        <p th:if="${courses.isEmpty()}" class="empty-hint" style="color:var(--gray-500); padding:24px;">
                            등록된 과정이 없습니다. 우측 상단 “과정 추가하기”로 첫 과정을 등록하세요.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
