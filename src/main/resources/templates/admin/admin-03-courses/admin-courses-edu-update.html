<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/course-cms.css">
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <style>.form-wrap { flex:1; min-height:0; overflow-y:auto; }</style>
    <title>Samsung Academy LXP - 과정 수정</title>
</head>
<body data-user-role="admin">
<header th:replace="~{fragments/admin :: header('과정/운영 관리 > 과정 관리 > 과정 수정')}"></header>
<th:block th:replace="~{fragments/admin :: sidebar('courses')}"/>
<main class="main-content">
    <div class="course-cms-page form-wrap">
        <div class="course-cms-inner">
            <div class="course-cms-heading">
                <div><h2>과정 수정</h2><p>내부 운영 정보와 홈페이지 공개 정보를 구분해 관리합니다.</p></div>
                <button type="button" class="btn btn-back" th:onclick="|location.href='/admin/courses/${courseId}'|">상세로</button>
            </div>
            <form th:action="@{/admin/courses/{id}(id=${courseId})}" th:object="${courseForm}" method="post">
                <th:block th:replace="~{admin/admin-03-courses/course-form-fields :: fields(true)}"/>
                <div class="course-cms-actions">
                    <button type="button" class="btn btn-back" th:onclick="|location.href='/admin/courses/${courseId}'|">취소</button>
                    <button type="submit" class="btn btn-save">저장하기</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
