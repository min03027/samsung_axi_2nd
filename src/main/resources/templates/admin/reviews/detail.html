<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후기 상세</title><link rel="stylesheet" href="/static/css/common-style.css"><link rel="stylesheet" href="/static/css/sidebar-style.css"><link rel="stylesheet" href="/static/css/review-cms.css"><script src="/static/js/sidebar-function.js" defer></script></head><body><header th:replace="~{fragments/management :: header('후기 상세')}"></header><th:block th:replace="~{fragments/management :: sidebar('reviews')}"></th:block><main class="main-content review-main"><div class="review-shell"><div class="review-head"><div><h1 th:text="${review.title}">후기</h1><p th:text="${review.authorDisplayName+' · '+review.contentType.label}">작성자</p></div><div class="review-actions"><a class="review-btn" href="/admin/reviews">목록</a><a class="review-btn primary" th:href="@{/admin/reviews/{id}/edit(id=${review.id})}">수정</a></div></div><div class="review-message" th:if="${message}" th:text="${message}">저장됨</div>
<section class="review-card"><dl class="review-detail-grid"><dt>공개 판정</dt><dd><span class="review-badge" th:classappend="${review.publicVisible and review.homepagePublicationConsent and review.status.name()=='ACTIVE'}?' visible':' blocked'" th:text="${review.publicVisible and review.homepagePublicationConsent and review.status.name()=='ACTIVE'?'공개 가능':'공개 차단'}">판정</span></dd><dt>후기 내용</dt><dd th:text="${review.content}">내용</dd><dt>표시 방식</dt><dd th:text="${review.authorDisplayType.label}">표시</dd><dt>과정</dt><dd th:text="${review.course!=null?review.course.courseName:'일반 인터뷰'}">과정</dd><dt>기수·연도</dt><dd th:text="${(review.cohortSnapshot?:review.course!=null?review.course.cohort:'-')+' · '+(review.completionYear?:'-')}">기수</dd><dt>취업 기업·직무</dt><dd th:text="${(review.employmentOrganization!=null?review.employmentOrganization.name:'-')+' · '+(review.jobTitle?:'-')}">취업</dd><dt>훈련 전 상황</dt><dd th:text="${review.preTrainingSituation?:'-'}">전</dd><dt>과정 경험</dt><dd th:text="${review.courseExperience?:'-'}">과정</dd><dt>프로젝트</dt><dd th:text="${review.projectExperience?:'-'}">프로젝트</dd><dt>취업 과정</dt><dd th:text="${review.employmentJourney?:'-'}">취업</dd><dt>현재 직무</dt><dd th:text="${review.currentRoleDetail?:'-'}">직무</dd><dt>이미지</dt><dd><img class="review-media" th:if="${review.imageUrl!=null}" th:src="${review.imageUrl}" alt="후기 이미지"><span th:unless="${review.imageUrl!=null}">미등록</span></dd><dt>영상 URL</dt><dd th:text="${review.videoUrl?:'미등록'}">영상</dd><dt>노출 사이트</dt><dd><div class="review-badges"><span class="review-badge" th:each="item:${review.exposureSites}" th:text="${item.label}">사이트</span></div></dd><dt>노출 위치</dt><dd><div class="review-badges"><span class="review-badge" th:each="item:${review.exposurePositions}" th:text="${item.label}">위치</span></div></dd><dt>동의</dt><dd th:text="${'홈페이지 '+(review.homepagePublicationConsent?'동의':'미동의')+' · 이미지 '+(review.imagePublicationConsent?'동의':'미동의')+' · 기업/직무 '+(review.employmentPublicationConsent?'동의':'미동의')+' · 영상 '+(review.videoPublicationConsent?'동의':'미동의')}">동의</dd><dt>관리자 메모</dt><dd th:text="${review.internalNote?:'-'}">메모</dd></dl></section></div></main></body></html>
