<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후기 관리</title><link rel="stylesheet" href="/static/css/common-style.css"><link rel="stylesheet" href="/static/css/sidebar-style.css"><link rel="stylesheet" href="/static/css/review-cms.css"><script src="/static/js/sidebar-function.js" defer></script></head><body>
<header th:replace="~{fragments/management :: header('후기 관리')}"></header><th:block th:replace="~{fragments/management :: sidebar('reviews')}"></th:block>
<main class="main-content review-main"><div class="review-shell"><div class="review-head"><div><h1>후기 관리</h1><p>공개 동의가 확인된 수강생·수료생 후기만 홈페이지에 노출합니다.</p></div><a class="review-btn primary" href="/admin/reviews/new">후기 등록</a></div>
<section class="review-card"><form class="review-filter" method="get" action="/admin/reviews"><div class="review-field"><label for="query">검색</label><input id="query" name="query" th:value="${query}" placeholder="제목·내용·표시명·직무·기업"></div><div class="review-field"><label for="courseId">과정</label><select id="courseId" name="courseId"><option value="">전체</option><option th:each="course:${courses}" th:value="${course.id}" th:text="${course.courseName}" th:selected="${selectedCourseId==course.id}">과정</option></select></div><div class="review-field"><label for="contentType">유형</label><select id="contentType" name="contentType"><option value="">전체</option><option th:each="item:${contentTypes}" th:value="${item}" th:text="${item.label}" th:selected="${selectedContentType==item}">유형</option></select></div><div class="review-field"><label for="publicVisible">공개 설정</label><select id="publicVisible" name="publicVisible"><option value="">전체</option><option value="true" th:selected="${selectedPublicVisible==true}">공개</option><option value="false" th:selected="${selectedPublicVisible==false}">비공개</option></select></div><div class="review-field"><label for="status">상태</label><select id="status" name="status"><option value="">전체</option><option th:each="item:${statuses}" th:value="${item}" th:text="${item.label}" th:selected="${selectedStatus==item}">상태</option></select></div><button class="review-btn" type="submit">조회</button></form></section>
<section class="review-card review-table-wrap"><table class="review-table"><thead><tr><th>후기</th><th>과정</th><th>취업 정보</th><th>유형</th><th>홈페이지</th><th>대표/순서</th><th>상태</th><th></th></tr></thead><tbody><tr th:each="item:${reviews}"><td class="review-title"><strong th:text="${item.title}">제목</strong><span class="review-sub" th:text="${item.authorDisplayName+' · '+item.authorDisplayType.label}">작성자</span></td><td><span th:text="${item.course!=null?item.course.courseName:'일반 후기'}">과정</span><span class="review-sub" th:text="${item.cohortSnapshot?:item.course!=null?item.course.cohort:'-'}">기수</span></td><td><span th:text="${item.employmentOrganization!=null?item.employmentOrganization.name:'-'}">기업</span><span class="review-sub" th:text="${item.jobTitle?:'-'}">직무</span></td><td th:text="${item.contentType.label}">유형</td><td><span class="review-badge" th:classappend="${item.publicVisible and item.homepagePublicationConsent and item.status.name()=='ACTIVE'}?' visible':' blocked'" th:text="${item.publicVisible and item.homepagePublicationConsent and item.status.name()=='ACTIVE'?'공개 가능':'공개 차단'}">상태</span></td><td th:text="${(item.featured?'대표 · ':'')+item.displayOrder}">순서</td><td th:text="${item.status.label}">상태</td><td><a th:href="@{/admin/reviews/{id}(id=${item.id})}">상세 보기 →</a></td></tr><tr th:if="${#lists.isEmpty(reviews)}"><td class="review-empty" colspan="8">조건에 맞는 후기가 없습니다.</td></tr></tbody></table></section></div></main></body></html>
