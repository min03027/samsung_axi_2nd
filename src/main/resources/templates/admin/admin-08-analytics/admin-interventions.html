<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/common-style.css"><link rel="stylesheet" href="/static/css/sidebar-style.css"><link rel="stylesheet" href="/static/css/analytics-workspace.css"><script src="/static/js/sidebar-function.js" defer></script><title>학습 개입·피드백 큐</title></head><body><header th:replace="~{fragments/admin :: header('학습 분석 > 개입·피드백 큐')}"></header><th:block th:replace="~{fragments/admin :: sidebar('analytics-interventions')}"/><main class="main-content"><section class="main-content-inner analytics-workspace">
<div class="analytics-topline"><div><h2>개입·피드백 통합 큐</h2><p>위험 알림, 상담 요청, 미제출 피드백을 담당자와 처리 상태 기준으로 모아봅니다.</p></div><div class="analytics-actions"><a class="analytics-link" href="/admin/analytics/dropout">위험 분석</a></div></div><div class="analytics-demo-note"><strong>1차 시연 화면</strong> · 큐 분류와 상세 이동을 확인할 수 있습니다. 실제 담당자 배정·상태 저장은 2차 연동 대상입니다.</div>
<div class="analytics-kpis"><article class="analytics-kpi"><span>오늘 신규</span><strong>6건</strong><small>위험 알림 4 · 상담 2</small></article><article class="analytics-kpi"><span>담당자 미배정</span><strong>3건</strong><small>우선 배정 필요</small></article><article class="analytics-kpi"><span>응답 대기</span><strong>5건</strong><small>24시간 초과 2건</small></article><article class="analytics-kpi"><span>이번 주 완료</span><strong>18건</strong><small>완료율 78%</small></article></div>
<section class="analytics-panel"><div class="analytics-panel-head"><div><h3>처리 대기 목록</h3><p>우선순위와 담당자를 확인하고 학습자 상세로 이동합니다.</p></div><div class="analytics-filter"><button>전체 8</button><button>고위험 5</button><button>상담 2</button><button>미제출 1</button></div></div><table class="analytics-table"><thead><tr><th>우선</th><th>학습자</th><th>과정</th><th>요청·알림</th><th>담당자</th><th>기한</th><th>상태</th><th>상세</th></tr></thead><tbody><tr th:each="t,stat:${prediction.riskTrainees}"><td><span class="analytics-status" th:classappend="${t.riskScore>=70}?' warn'" th:text="${t.level}">고위험</span></td><td th:text="${t.name}">이름</td><td th:text="${t.courseName}">과정</td><td th:text="${t.mainFactor}">요인</td><td th:text="${stat.index%2==0}?'멘토 김서현':'배정 필요'">담당자</td><td th:text="${stat.index<3}?'오늘':'08.28'">기한</td><td><span class="analytics-status" th:text="${stat.index%3==0}?'응답 대기':'확인 필요'">상태</span></td><td><a class="analytics-link" th:href="@{/admin/analytics/dropout/trainees/{id}(id=${t.loginId})}">열기</a></td></tr></tbody></table></section>
</section></main></body></html>
