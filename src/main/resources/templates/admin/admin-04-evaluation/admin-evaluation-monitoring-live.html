<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/proctor-enhancements.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 메인 콘텐츠 */
        .main-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .online-header{
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-line-gray);
        }

        .online-header > h2
        {
            font-size: 20px;
            font-weight: normal;
            color: var(--color-font-gray);
            min-width: 80px;
            margin: 0;
            text-align: center;
        }

        .student-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            overflow-x: auto;
            padding: 4px 0;
        }

        .student-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--color-line-gray);
            border-radius: 20px;
            font-size: 14px;
            color: var(--gray-800);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .student-btn:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(var(--color-primary-rgb), 0.3);
        }

        .student-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .student-btn.all {
            font-weight: 600;
            border-width: 2px;
        }

        .student-btn.all:hover,
        .student-btn.all.active {
            background: var(--color-primary-hover);
            border-color: var(--color-primary-hover);
        }

        .student-btn .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px rgba(0,255,0,0.6);
        }

        /* 비디오 그리드 (5x4 = 20개) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            /* height는 JavaScript로 동적 설정 */
        }

        .video-item {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid var(--color-line-gray);
        }

        .video-item:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            border-color: var(--color-primary);
        }

        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            aspect-ratio: 16/9;
        }

        .video-item .video-label {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .video-item .video-status {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 8px rgba(0,255,0,0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 전체화면 비디오 */
        .fullscreen-video {
            position: fixed;
            /* top: var(--header-height); */
            bottom: 0;
            left: 250px;
            width: calc(100vw - 250px);
            height: calc(100vh - var(--header-height));
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-video.active {
            display: flex;
        }

        .fullscreen-video video {
            max-width: 95%;
            max-height: 95%;
            aspect-ratio: 16/9;
        }

        .fullscreen-video .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .fullscreen-video .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .fullscreen-video .video-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        /* ===== 감독 패널 (서버 연동으로 추가) ===== */
        .video-grid.proctor {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-template-rows: none;
            grid-auto-rows: minmax(150px, auto);
        }

        .video-item.severity-critical { border-color: var(--color-danger); }
        .video-item.severity-warn { border-color: #F9A825; }
        .video-item .video-placeholder {
            width: 100%; height: 100%; min-height: 140px;
            display: flex; align-items: center; justify-content: center;
            color: var(--gray-500); font-size: 13px; text-align: center; padding: 8px;
            background: repeating-linear-gradient(45deg, var(--gray-900), var(--gray-900) 10px, #1a1a1a 10px, #1a1a1a 20px);
        }
        .video-item .video-meta {
            position: absolute; bottom: 8px; left: 8px; right: 8px;
            display: flex; justify-content: space-between; gap: 6px;
            color: #fff; font-size: 12px;
        }
        .video-item .badge-critical { color: #ff6b6b; font-weight: 700; }

        .proctor-summary { display: flex; gap: 20px; flex-wrap: wrap; margin: 16px 0 8px; font-size: 14px; }
        .proctor-summary strong { font-size: 18px; }

        .proctor-table { width: 100%; border-collapse: collapse; margin-top: 8px; background: #fff; font-size: 13px; }
        .proctor-table th, .proctor-table td { border-bottom: 1px solid var(--color-line-gray); padding: 8px 10px; text-align: left; }
        .proctor-table th { background: #f5f6f8; font-weight: 600; white-space: nowrap; }
        .proctor-table td.actions { white-space: nowrap; }
        .proctor-table input[type=text] { padding: 5px 8px; border: 1px solid var(--color-line-gray); border-radius: 4px; width: 190px; }
        .sev-critical { color: var(--color-danger); font-weight: 700; }
        .sev-warn { color: #F9A825; font-weight: 600; }

        .event-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10000; align-items: center; justify-content: center; }
        .event-modal.active { display: flex; }
        .event-modal .modal-box { background: #fff; border-radius: 8px; width: min(900px, 92vw); max-height: 80vh; overflow: auto; padding: 20px; }
        .flash-message { margin: 0 0 12px; padding: 10px 14px; border-radius: 6px; background: #E8F4FF; color: #0b4a7d; font-size: 14px; }
    </style>
</head>
<body>
    <!-- 상단 헤더 / 사이드바 / 토글 버튼 — 공통 fragment 로 교체 (fragments/admin.html) -->
    <header th:replace="~{fragments/admin :: header('평가 관리 > 평가 모니터링 > 실시간 시험 현황')}"></header>
    <th:block th:replace="~{fragments/admin :: sidebar('eval-monitoring')}"/>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <p class="flash-message" th:if="${message}" th:text="${message}"></p>

        <!-- 현재 학생 header -->
        <section class="online-header">
            <h2>접속중</h2>
            <div class="student-list" id="studentList">
                <button type="button" class="student-btn all active" onclick="filterStudent(null, this)"><span>전체보기</span></button>
                <button type="button" class="student-btn" th:each="row : ${monitor.rows}"
                        th:classappend="${row.live} ? '' : 'inactive'"
                        th:attr="onclick=|filterStudent('${row.attemptId}', this)|,data-attempt-id=${row.attemptId}"
                        th:title="${row.statusLabel}">
                    <span class="status-dot" th:style="${row.live} ? 'background:#00ff00' : 'background:var(--gray-400);box-shadow:none'"></span>
                    <span th:text="${row.traineeName}">응시자</span>
                </button>
            </div>
        </section>

        <!-- 시험 요약 -->
        <div class="proctor-summary">
            <span th:text="|시험: ${monitor.examName}|">시험</span>
            <span th:text="|과정: ${monitor.courseName} (${monitor.courseId})|">과정</span>
            <span th:text="|응시기간: ${monitor.windowStart} ~ ${monitor.windowEnd}|">기간</span>
            <span>응시중 <strong th:text="${monitor.inProgress}">0</strong></span>
            <span>완료 <strong th:text="${monitor.completed}">0</strong></span>
            <span>미응시 <strong th:text="${monitor.notStarted}">0</strong></span>
            <span>무효 <strong th:text="${monitor.voided}">0</strong></span>
            <span>수강생 <strong th:text="${monitor.enrolled}">0</strong></span>
            <button type="button" class="btn btn-secondary" onclick="location.reload()">새로고침</button>
            <a th:href="${monitor.listUrl}" class="btn btn-secondary">목록</a>
        </div>

        <!-- 검색·필터·위험도 요약 (LXP-020). JS 가 채운다. -->
        <div id="proctorToolsMount"></div>

        <!--
          카메라 그리드.
          실제 웹캠 스트리밍은 이 슬라이스 범위 밖이다 (별도 미디어 서버가 필요하다).
          여기서는 응시자별 타일에 서버가 아는 사실(상태 / 남은시간 / 이상행위 카운트)만 얹는다.
        -->
        <div class="video-grid proctor" id="videoGrid">
            <div class="video-item" th:each="row : ${monitor.rows}"
                 th:id="|tile-${row.attemptId}|"
                 th:classappend="${row.criticalCount > 0} ? 'severity-critical' : (${row.warnCount > 0} ? 'severity-warn' : '')"
                 th:attr="data-attempt-id=${row.attemptId}">
                <div class="video-placeholder">웹캠 스트리밍 미연동<br>(감독 데이터만 표시)</div>
                <div class="video-label" th:text="|${row.traineeName} · ${row.statusLabel}|">응시자</div>
                <div class="video-meta">
                    <span class="remain" th:attr="data-remain=${row.remainSeconds}"
                          th:text="${row.remainLabel}">-</span>
                    <span th:classappend="${row.criticalCount > 0} ? 'badge-critical'"
                          th:text="|이상 ${row.warnCount + row.criticalCount}건|">이상 0건</span>
                </div>
            </div>
        </div>

        <!-- 응시자 감독 패널 -->
        <table class="proctor-table">
            <thead>
                <tr>
                    <th>응시자</th>
                    <th>계정</th>
                    <th>회차</th>
                    <th>상태</th>
                    <th>시작</th>
                    <th>남은시간</th>
                    <th>이상행위(주의/심각)</th>
                    <th>발송경고</th>
                    <th>IP</th>
                    <th>조치</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${monitor.rows}" th:attr="data-attempt-id=${row.attemptId}">
                    <td th:text="${row.traineeName}">응시자</td>
                    <td th:text="${row.loginId}">loginId</td>
                    <td th:text="${row.attemptNo}">1</td>
                    <td th:text="${row.statusLabel}">상태</td>
                    <td th:text="${row.startedAt}">-</td>
                    <td class="remain" th:attr="data-remain=${row.remainSeconds}" th:text="${row.remainLabel}">-</td>
                    <td>
                        <span th:classappend="${row.warnCount > 0} ? 'sev-warn'" th:text="${row.warnCount}">0</span>
                        /
                        <span th:classappend="${row.criticalCount > 0} ? 'sev-critical'" th:text="${row.criticalCount}">0</span>
                    </td>
                    <td th:text="${row.warningSent}">0</td>
                    <td th:text="${row.ip}">-</td>
                    <td class="actions">
                        <button type="button" class="btn btn-secondary"
                                th:attr="onclick=|showEvents('${row.attemptId}','${row.traineeName}')|">로그</button>

                        <!-- 경고 발송: 관리자·강사 모두 가능 (권한정의서(1) 16행) -->
                        <form th:action="${monitor.attemptUrlPrefix + row.attemptId + '/warning'}"
                              method="post" style="display:inline-flex; gap:4px; align-items:center;">
                            <input type="hidden" name="redirect" th:value="${selfUrl}">
                            <input type="text" name="message" placeholder="경고 메시지">
                            <button type="submit" class="btn btn-primary">경고 발송</button>
                        </form>

                        <!-- 응시 무효 처리: 관리자만 (강사에게는 버튼 자체를 내리지 않고, 서버도 다시 막는다) -->
                        <form th:if="${monitor.canVoid}"
                              th:action="${monitor.attemptUrlPrefix + row.attemptId + '/void'}"
                              method="post" style="display:inline-flex; gap:4px; align-items:center;"
                              onsubmit="return confirm('이 응시를 무효 처리합니다. 계속할까요?');">
                            <input type="hidden" name="redirect" th:value="${selfUrl}">
                            <input type="text" name="reason" placeholder="무효 사유">
                            <button type="submit" class="btn btn-secondary">무효 처리</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(monitor.rows)}">
                    <td colspan="10" style="text-align:center; color:var(--gray-500);">응시 기록이 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <!-- 실행환경 패널 (LXP-013). 새 백엔드 라우트를 만들지 않고 이 화면 안에 둔다. -->
        <div id="runtimePanelMount"></div>
    </main>

    <!-- 입·퇴장 / 이상행위 로그 모달 -->
    <div class="event-modal" id="eventModal" onclick="if(event.target===this) closeEvents()">
        <div class="modal-box">
            <h3 id="eventTitle" style="margin-top:0;">이벤트 로그</h3>
            <table class="proctor-table">
                <thead>
                    <tr><th>발생 시각</th><th>유형</th><th>심각도</th><th>IP</th><th>상세</th></tr>
                </thead>
                <tbody id="eventBody"></tbody>
            </table>
            <div style="text-align:right; margin-top:12px;">
                <button type="button" class="btn btn-secondary" onclick="closeEvents()">닫기</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const EVENTS_PREFIX = /*[[${monitor.attemptUrlPrefix}]]*/ '';

        /* 확장 스크립트가 쓰는 계약. 서버가 준 행을 그대로 넘긴다 —
           화면에서 값을 만들어내지 않기 위해서다. */
        window._proctorRows = /*[[${monitor.rows}]]*/ [];
        window._proctorUrls = { attemptPrefix: EVENTS_PREFIX };
        /*]]>*/

        // 남은 시간은 서버가 expiresAt 으로 계산해 내려준 값에서 출발한다.
        // 화면 카운트다운은 표시용일 뿐 판정에 쓰지 않는다 (응시 슬라이스와 같은 원칙).
        function tick() {
            document.querySelectorAll('.remain[data-remain]').forEach(el => {
                let sec = parseInt(el.dataset.remain, 10);
                if (isNaN(sec) || sec <= 0) return;
                sec -= 1;
                el.dataset.remain = sec;
                const h = String(Math.floor(sec / 3600)).padStart(2, '0');
                const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                el.textContent = `${h}:${m}:${s}`;
            });
        }
        setInterval(tick, 1000);

        // 응시자 선택 — 해당 타일만 남긴다 (카메라 확대는 스트리밍 연동 후)
        function filterStudent(attemptId, btn) {
            document.querySelectorAll('.student-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.querySelectorAll('#videoGrid .video-item').forEach(item => {
                item.style.display = (!attemptId || item.dataset.attemptId === attemptId) ? '' : 'none';
            });
        }

        function showEvents(attemptId, name) {
            const body = document.getElementById('eventBody');
            body.innerHTML = '<tr><td colspan="5">불러오는 중...</td></tr>';
            document.getElementById('eventTitle').textContent = `${name} — 입·퇴장 / 이상행위 로그`;
            document.getElementById('eventModal').classList.add('active');

            fetch(`${EVENTS_PREFIX}${attemptId}/events`, { credentials: 'same-origin' })
                .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
                .then(rows => {
                    if (!rows.length) {
                        body.innerHTML = '<tr><td colspan="5">기록이 없습니다.</td></tr>';
                        return;
                    }
                    body.innerHTML = rows.map(r => `
                        <tr>
                            <td>${r.occurredAt}</td>
                            <td>${r.eventLabel}</td>
                            <td class="${r.severity === 'CRITICAL' ? 'sev-critical' : (r.severity === 'WARN' ? 'sev-warn' : '')}">${r.severityLabel}</td>
                            <td>${r.ip}</td>
                            <td>${r.detail || '-'}</td>
                        </tr>`).join('');
                })
                .catch(err => {
                    body.innerHTML = `<tr><td colspan="5">로그를 불러오지 못했습니다 (${err.message})</td></tr>`;
                });
        }

        function closeEvents() {
            document.getElementById('eventModal').classList.remove('active');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEvents(); });
    </script>
    <!-- 감독 화면 확장 (LXP-003 / 005 / 013 / 020).
         기존 showEvents·filterStudent 정의 뒤에 로드해 그 함수를 재사용한다. -->
    <script src="/static/js/proctor-enhancements.js"></script>

</body>
</html>
