<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    <link rel="stylesheet" href="/static/css/contents.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <script src="/static/js/contents.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
</head>
<body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('콘텐츠 관리 > 문제은행')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('contents-qbank')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section class="main-content-inner">
            <!-- 상단: 탭 영역 -->
            <div class="tab-section" style="margin-bottom:20px;">
                <div class="tab-row" style="display:flex; gap:8px;">
                    <button class="tab-btn active flex" data-type="전체">전체</button>
                    <button class="tab-btn flex" data-type="영상"><img src="/static/icons/content-video.png" alt="영상 icon" style="width:32px;vertical-align:middle;margin-right:6px;">영상</button>
                    <button class="tab-btn flex" data-type="문서"><img src="/static/icons/content-document.png" alt="문서 icon" style="width:32px;vertical-align:middle;margin-right:6px;">문서</button>
                    <button class="tab-btn flex" data-type="강의"><img src="/static/icons/content-class.png" alt="강의 icon" style="width:32px;vertical-align:middle;margin-right:6px;">강의</button>
                    <button class="tab-btn flex" data-type="과제"><img src="/static/icons/content-practice.png" alt="과제 icon" style="width:32px;vertical-align:middle;margin-right:6px;">과제</button>
                    <button class="tab-btn flex" data-type="문제"><img src="/static/icons/content-test.png" alt="문제 icon" style="width:32px;vertical-align:middle;margin-right:6px;">문제</button>
                    <button class="tab-btn flex" data-type="시험"><img src="/static/icons/content-grading.png" alt="시험 icon" style="width:32px;vertical-align:middle;margin-right:6px;">시험</button>
                </div>
            </div>
            <!-- 상단: 검색/필터 영역 -->
            <div class="filter-section" style="margin-bottom:24px;">
              <form th:action="@{/admin/evaluation/questions}" method="get">
                <div class="filter-row">
                    <!-- 유형 -->
                    <div>
                        <label>유형</label>
                        <select class="input" name="type">
                            <option th:each="t : ${ {'전체','영상','문서','강의','과제','문제','시험'} }"
                                    th:value="${t}" th:text="${t}"
                                    th:selected="${cond.type == t}">전체</option>
                        </select>
                    </div>
                    <!-- 제목(검색) -->
                    <div style="flex:1;">
                        <label>제목</label>
                        <input type="text" class="input" name="keyword" th:value="${cond.keyword}" placeholder="콘텐츠명 검색">
                    </div>
                    <!-- 난이도 -->
                    <div>
                        <label>난이도</label>
                        <select class="input" name="difficulty">
                            <option value="전체" th:selected="${cond.difficulty == '전체'}">전체</option>
                            <option value="easy" th:selected="${cond.difficulty == 'easy'}">easy</option>
                            <option value="medium" th:selected="${cond.difficulty == 'medium'}">medium</option>
                            <option value="hard" th:selected="${cond.difficulty == 'hard'}">hard</option>
                        </select>
                    </div>
                    <!-- 카테고리 -->
                    <div>
                        <label>카테고리</label>
                        <select class="input" name="category">
                            <option value="전체" th:selected="${cond.category == '전체'}">전체</option>
                            <option value="KDT" th:selected="${cond.category == 'KDT'}">KDT</option>
                            <option value="고교위탁" th:selected="${cond.category == '고교위탁'}">고교위탁</option>
                        </select>
                    </div>
                    <!-- 상태 -->
                    <div>
                        <label>상태</label>
                        <select class="input" name="status">
                            <option value="전체" th:selected="${cond.status == '전체'}">전체</option>
                            <option value="Active" th:selected="${cond.status == 'Active'}">활성화</option>
                            <option value="Archived" th:selected="${cond.status == 'Archived'}">비활성화</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-secondary" id="searchBtn">검색하기</button>
                    <button type="button" class="btn btn-primary" id="addBtn" style="width: 130px; height: 38px;">+ 등록하기</button>
                    <!-- 유형 선택 모달: JS로 동적 생성 -->
                </div>
              </form>
            </div>

            <div style="display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:10px;">
                <!-- 엑셀 업로드(일괄 등록)는 아직 서버가 없다. uploadExcel() 이 정의된 적이 없어
                     누르면 ReferenceError 만 났다 — 안내로 바꿔 둔다. -->
                <button id="excelUploadBtn" type="button" class="btn-gray btn flex" disabled
                        title="엑셀 일괄 등록은 2차 서버 연동 항목입니다.">
                    <img src="/static/icons/excel.svg" alt="Excel icon" style="margin-right: 8px;">
                    <span>엑셀로 등록 (2차)</span>
                </button>
                <!-- 현재 검색 조건 전체를 xlsx 로 내린다 (보이는 페이지 10건이 아니라). -->
                <button id="excelDownloadBtn" type="button" class="btn-gray btn flex"
                        th:data-export-url="@{/admin/evaluation/questions/export.xlsx}"
                        onclick="downloadQuestionExcel(this)">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M480-315.33 284.67-510.67l47.33-48L446.67-444v-356h66.66v356L628-558.67l47.33 48L480-315.33ZM226.67-160q-27 0-46.84-19.83Q160-199.67 160-226.67V-362h66.67v135.33h506.66V-362H800v135.33q0 27-19.83 46.84Q760.33-160 733.33-160H226.67Z"/></svg>                        
                    <span>엑셀로 다운로드</span>
                </button>
            </div>
            <!-- 중단: 문제 리스트 (테이블) -->
            <div class="question-table-area">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:var(--gray-50);">
                            <th><input type="checkbox" name="select_all" id="select_all"></th>
                            <th>유형</th>
                            <th>제목</th>
                            <th>난이도</th>
                            <th>카테고리</th>
                            <th>사용중인 과정 수</th>
                            <th>평균 성취도</th>
                            <th>생성일</th>
                            <th>상태</th>
                            <th>수정하기</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS로 데이터 렌더링 -->
                    </tbody>
                </table>
                <div class="bulk-action-area">
                    <button type="button" id="bulkDeleteBtn" data-user-role="admin" class="btn btn-gray btn-sm">선택 삭제</button>
                    <button type="button" id="bulkDeactivateBtn" class="btn btn-gray btn-sm">선택한 문제 비활성화</button>
                </div>
            </div>

            <!-- 하단: 페이징/일괄 액션 -->
            <div class="question-bottom-area">
                <div class="pagination">
                    <div class="page-info">
                        <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                    </div>
                    <div class="pagination-controls">
                        <button id="prevPage" onclick="changePage(-1)" disabled>이전</button>
                        <div id="pageNumbers"></div>
                        <button id="nextPage" onclick="changePage(1)">다음</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 문제 상세 모달 -->
    <div id="questionModal" class="question-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">문제 상세</h3>
                <button class="modal-close" onclick="document.getElementById('questionModal').classList.remove('show')">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="CurrentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- JS로 내용 바인딩 -->
            </div>
        </div>
    </div>


    <!-- ===== 서버 연동 (개발자 B) ===== -->
    <!-- 일괄 액션용 POST 폼. th:action 이면 Thymeleaf 가 CSRF 히든필드를 자동으로 넣는다. -->
    <form id="bulkForm" method="post" th:action="@{/admin/evaluation/questions/deactivate}" style="display:none;">
        <input type="hidden" name="ids" id="bulkIds">
    </form>

    <!--
      contents.js 는 defer 라서 파싱 이후에 실행된다. 이 인라인 스크립트는 파싱 중에 먼저
      실행되므로, contents.js 가 window._serverContentRows 를 읽는 시점에는 이미 채워져 있다.
    -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window._serverContentRows = /*[[${rows}]]*/ [];
        window._questionUrls = {
            add:  /*[[@{/admin/evaluation/questions/new}]]*/ '/admin/evaluation/questions/new',
            // {id} 자리표시자는 contents.js 가 치환한다 (@{} 로는 표현할 수 없어 리터럴로 둔다)
            edit: '/admin/evaluation/questions/{id}/edit'
        };
        // 서버 페이징 정보 — server-pagination.js 가 이 값으로 페이지 링크를 그린다
        window._serverPage = /*[[${page}]]*/ null;
        window._questionBulkUrls = {
            deactivate: /*[[@{/admin/evaluation/questions/deactivate}]]*/ '',
            remove:     /*[[@{/admin/evaluation/questions/delete}]]*/ ''
        };

        /**
         * "엑셀로 다운로드" — 화면의 검색 폼 값을 그대로 붙여 서버에 넘긴다.
         * 폼을 다시 제출하지 않고 URL 만 만들어 이동하므로 목록 상태가 유지된다.
         * (버튼 disable 처리는 contents.js 가 탭에 따라 하고 있다 — 건드리지 않는다.)
         */
        function downloadQuestionExcel(button) {
            var form = document.querySelector('.filter-section form');
            var query = form ? new URLSearchParams(new FormData(form)).toString() : '';
            window.location.href = button.dataset.exportUrl + (query ? '?' + query : '');
        }
        /*]]>*/
    </script>
    <script src="/static/js/question-bank-bulk.js" defer></script>
    <script src="/static/js/server-pagination.js" defer></script>

    <div th:if="${message}" class="toast-message" th:text="${message}"
         style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gray-800);color:#fff;padding:12px 20px;border-radius:6px;z-index:9999;"></div>
</body>
</html>
