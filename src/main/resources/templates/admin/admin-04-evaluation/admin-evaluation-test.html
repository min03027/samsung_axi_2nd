<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/sidebar-style.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/pagination.css">
    
    <script src="/static/js/sidebar-function.js" defer></script>
    <script src="/static/js/common-funtion.js" defer></script>
    <script src="/static/js/pagination.js" defer></script>
    <title>Samsung Academy LXP - 관리자</title>
    <style>
        /* 메인 콘텐츠 영역 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-800);
        }

        /* 필터 영역 */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--color-line-gray);
        }

        .filter-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-row label {
            margin-right: 8px;
            font-weight: 500;
            color: var(--gray-800);
        }

        .filter-item {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .filter-item label {
            word-break: keep-all;
        }

        /* 시험 목록 */
        .test-list {
            text-align: center;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--color-line-gray);
        }

        .test-header {
            display: grid;
            grid-template-columns: 50px 50px 1.5fr 2.5fr 0.5fr 0.5fr 0.5fr 0.5fr 0.5fr;
            gap: 16px;
            padding: 16px 20px;
            background: var(--gray-100);
            border-bottom: 2px solid var(--color-line-gray);
            font-weight: 600;
            font-size: 14px;
            color: var(--gray-600);
            border-radius: 8px 8px 0 0;
        }

        .test-item {
            display: grid;
            grid-template-columns: 50px 50px 1.5fr 2.5fr 0.5fr 0.5fr 0.5fr 0.5fr 0.5fr;
            gap: 16px;
            padding: 20px;
            border-bottom: 1px solid var(--color-line-gray);
            align-items: center;
            transition: background 0.2s;
            cursor: pointer;
        }

        .test-item:hover {
            background: #f9f9f9;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #fee;
        }

        .delete-btn img {
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }

        .delete-btn:hover img {
            opacity: 1;
        }
        .delete-column {
            display: flex;
            text-align: center;
            justify-content: center;
        }
        .test-item:last-child {
            border-bottom: none;
        }

        .test-number {
            font-weight: 600;
            color: var(--gray-800);
        }

        .test-course { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .eclipse {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .course-name {
            font-weight: 600;
            color: var(--gray-800);
            font-size: 15px;
        }

        .course-id {
            font-size: 13px;
            color: var(--gray-500);
        }

        .test-name {
            font-weight: 500;
            color: var(--color-primary);
            font-size: 14px;
        }

        .instructor-name {
            font-size: 14px;
            color: var(--gray-600);
        }

        .test-time-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 13px;
        }

        .test-date {
            color: var(--gray-800);
            font-weight: 500;
        }

        .test-time {
            color: var(--gray-500);
        }

        .submission-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 13px;
        }

        .submitted {
            color: var(--color-success);
            font-weight: 600;
        }

        .not-submitted {
            color: var(--color-warning);
            font-weight: 600;
        }

        .test-status {
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-active {
            background: var(--color-info-bg);
            color: var(--color-primary-active);
        }

        .status-closed {
            background: var(--gray-100);
            color: var(--gray-500);
        }

        .status-upcoming {
            background: var(--color-warning-bg);
            color: var(--color-warning);
        }

        #pageNumbers {
            display: flex;
            gap: 4px;
        }

        .page-number-btn {
            padding: 8px 12px;
            border: 1px solid var(--color-line-gray);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .page-number-btn:hover {
            background: var(--gray-100);
        }

        .page-number-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .page-info {
            font-size: 14px;
            color: var(--gray-600);
        }

        /* 시험 운영 설정 배지 — 모의 테스트 / 문제 세트 / 성적 공개 */
        .exam-tag {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag-practice { background: var(--color-warning-bg); color: var(--color-warning); }
        .tag-set { background: #EDE7F6; color: #5E35B1; }
        .tag-release { background: #ECEFF1; color: #546E7A; font-weight: 500; }

    </style>
</head><body data-user-role="admin">
    <!-- 상단 헤더 -->
    <header th:replace="~{fragments/admin :: header('평가 관리 &gt; 시험 관리')}"></header>

    <!-- 왼쪽 사이드바 -->
    <th:block th:replace="~{fragments/admin :: sidebar('eval-exam')}"></th:block>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <!-- 시험 관리 -->
        <section class="main-content-inner">

            <!-- 처리 결과 안내 -->
            <div th:if="${message}" class="alert-message"
                 style="margin-bottom:16px;padding:12px 16px;border-radius:6px;background:var(--color-info-bg);color:var(--color-primary-active);font-size:14px;"
                 th:text="${message}"></div>

            <!-- 필터 영역 -->
            <div class="filter-section">
                <form th:action="@{/admin/evaluation/exams}" method="get" id="examFilterForm">
                <div class="filter-row">
                    <div>
                        <label>과정</label>
                        <select id="courseFilter" name="courseId">
                            <option value="">전체</option>
                            <option th:each="c : ${courseOptions}"
                                    th:value="${c.value}" th:text="${c.label}"
                                    th:selected="${cond.courseId != null and #strings.toString(cond.courseId) == c.value}"></option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select id="statusFilter" name="status">
                            <option value="" th:selected="${cond.status == null or cond.status == ''}">전체</option>
                            <option value="active" th:selected="${cond.status == 'active'}">활성화</option>
                            <option value="inactive" th:selected="${cond.status == 'inactive'}">비활성화</option>
                        </select>
                    </div>
                    <div>
                        <label>강사명</label>
                        <select id="instructorFilter" name="instructor">
                            <option value="">전체</option>
                            <option th:each="i : ${instructorOptions}"
                                    th:value="${i.label}" th:text="${i.label}"
                                    th:selected="${cond.instructor == i.label}"></option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>검색</label>
                        <input type="text" id="searchInput" name="keyword" th:value="${cond.keyword}"
                               placeholder="시험명으로 검색">
                    </div>
                    <button class="btn btn-secondary" type="submit">
                        검색하기
                    </button>
                    <button class="btn btn-primary" type="button"
                            th:onclick="|location.href='@{/admin/evaluation/exams/new}'|"
                            style="width: 130px; height: 38px;">
                        <span>+</span>
                        <span>시험 추가</span>
                    </button>
                    <button class="btn btn-secondary" type="button"
                            th:onclick="|location.href='@{/admin/evaluation/exams/graders}'|"
                            style="width: 138px; height: 38px;">
                        그레이더 설정
                    </button>
                </div>
                </form>
            </div>

            <!-- 시험 목록 -->
            <form th:action="@{/admin/evaluation/exams/delete}" method="post" id="bulkForm">
            <div class="test-list">
                <div class="test-header">
                    <div><input type="checkbox" id="selectAllTests"></div>
                    <div>번호</div>
                    <div>시험명</div>
                    <div>과정 / 응시기간</div>
                    <div>강사명</div>
                    <div>소요시간</div>
                    <div>문항 수</div>
                    <div>상태</div>
                    <div>수정하기</div>
                </div>
                <div id="testItemsContainer">
                    <div class="test-item" th:each="row, stat : ${rows}" th:attr="data-id=${row.id}">
                        <div><input type="checkbox" class="test-checkbox" name="ids" th:value="${row.id}"></div>
                        <!-- 서버 페이징이라 번호는 페이지 오프셋을 더해야 2페이지가 1부터 다시 시작하지 않는다 -->
                        <div class="test-number"
                             th:text="${page != null ? (page.page - 1) * page.size + stat.count : stat.count}">1</div>
                        <div class="test-name">
                            <span th:text="${row.examName}">시험명</span>
                            <!-- 사전 모의 테스트는 성적에 반영되지 않는다 — 정식 시험과 반드시 구분해서 보여준다 -->
                            <span class="exam-tag tag-practice" th:if="${row.practiceMode}">모의</span>
                        </div>
                        <div class="test-course eclipse" style="display:flex;flex-direction:column;gap:2px;">
                            <span class="course-name" th:text="${row.courseName}">과정명</span>
                            <span class="course-id" th:text="${row.windowStart} + ' ~ ' + ${row.windowEnd}">응시기간</span>
                        </div>
                        <div class="instructor-name" th:text="${row.instructorName}">강사명</div>
                        <div class="test-time-info" th:text="${row.timeLimitMin} + '분'">60분</div>
                        <div class="submission-info">
                            <span th:text="${row.questionCount} + '문항'">0문항</span>
                            <!-- 세트가 여러 벌이면 위 문항 수는 전 세트 합계다. 응시자는 그중 한 세트만 푼다. -->
                            <span class="exam-tag tag-set" th:if="${row.questionSetCount > 1}"
                                  th:text="'세트 ' + ${row.questionSetCount} + '개'">세트</span>
                            <span class="exam-tag tag-release" th:text="${row.resultReleaseText}">즉시 공개</span>
                        </div>
                        <div class="test-status" style="display:flex;flex-direction:column;gap:4px;align-items:center;">
                            <span class="status-badge"
                                  th:classappend="${row.statusGroup == 'active'} ? 'status-active' : 'status-closed'"
                                  th:text="${row.status}">상태</span>
                            <!-- 내역서 요건: 본인인증 강제 여부를 목록에서 바로 확인할 수 있어야 한다 -->
                            <span th:if="${row.requireIdentityVerification}"
                                  style="font-size:11px;color:var(--color-success);">본인인증</span>
                            <span th:unless="${row.requireIdentityVerification}"
                                  style="font-size:11px;color:var(--color-danger);">인증없음</span>
                        </div>
                        <div>
                            <button class="btn btn-secondary" type="button"
                                    th:onclick="|location.href='@{/admin/evaluation/exams/{id}/edit(id=${row.id})}'|">수정하기</button>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(rows)}"
                         style="padding:40px;text-align:center;color:var(--gray-500);font-size:14px;">
                        등록된 시험이 없습니다.
                    </div>
                </div>
            </div>

            <!-- Bulk action buttons -->
            <div class="bulk-action-area" style="display:flex; gap:10px; margin:16px 0 0 0;">
                <button class="btn btn-gray btn-sm" id="bulkDeleteBtn" type="submit" data-user-role="admin">선택 삭제</button>
                <button class="btn btn-gray btn-sm" id="bulkDisableBtn" type="submit"
                        th:formaction="@{/admin/evaluation/exams/deactivate}">선택한 시험 비활성화</button>
            </div>
            </form>

            <!--
              페이지네이션 — 서버가 한 페이지 분량만 내려준다.
              링크는 server-pagination.js 가 window._serverPage 를 보고 그린다.
              id(prevPage/nextPage/pageNumbers/currentPageInfo/totalPagesInfo)는 다른 화면과 같은 것을 쓴다.
            -->
            <div class="pagination">
                <div class="page-info">
                    <span id="currentPageInfo">1</span> / <span id="totalPagesInfo">1</span> 페이지
                    <span class="total-count" th:if="${page != null}"
                          th:text="'(총 ' + ${page.totalCount} + '건)'">(총 0건)</span>
                </div>
                <div class="pagination-controls">
                    <button type="button" id="prevPage" disabled>이전</button>
                    <div id="pageNumbers"></div>
                    <button type="button" id="nextPage">다음</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 서버 페이징 정보 — server-pagination.js 가 이 값으로 페이지 링크를 그린다 (문제은행과 같은 방식) -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window._serverPage = /*[[${page}]]*/ null;
        /*]]>*/
    </script>
    <script src="/static/js/server-pagination.js" defer></script>

    <script>
        // 체크박스 전체선택/해제 — 서버가 th:each 로 그린 행에 그대로 붙는다.
        document.addEventListener('DOMContentLoaded', function() {
            const selectAll = document.getElementById('selectAllTests');
            const checkboxes = document.querySelectorAll('.test-checkbox');
            if (selectAll) {
                selectAll.addEventListener('change', function() {
                    checkboxes.forEach(cb => { cb.checked = selectAll.checked; });
                });
                checkboxes.forEach(cb => {
                    cb.addEventListener('change', function() {
                        selectAll.checked = Array.from(checkboxes).every(c => c.checked);
                    });
                });
            }

            // 선택 없이 일괄 처리 누르는 실수 방지
            document.getElementById('bulkForm').addEventListener('submit', function(e) {
                const checked = document.querySelectorAll('.test-checkbox:checked').length;
                if (checked === 0) {
                    e.preventDefault();
                    alert('먼저 시험을 선택하세요.');
                }
            });
        });
    </script>
</body>
</html>
