<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/chatbot.css">
  <script src="/static/js/chatbot.js" defer></script>
	<link rel="stylesheet" href="/static/css/basic-form-trainee.css">
	<link rel="stylesheet" href="/static/css/btn-style.css">
	<link rel="stylesheet" href="/static/css/trainee/surveys.css">
	<script src="/static/js/trainee/surveys.js" defer></script>
	<title>Samsung Academy LXP</title>
</head>
<!-- ********************************************************************************************************* -->
<body>
<header th:replace="~{fragments/trainee :: header('assessment')}"></header>
    <!-- 메인 컨텐츠 ********************************************************************************************************* -->
	<main>
		
		<section class="main-content-top">
			<div class="main-wrap">
				<h2>설문조사</h2>
			</div>
		</section>

		<section class="main-content main-wrap">
			<!-- 설문조사 페이지 내용 -->
			 <div class="survey-list-page">

  <div class="page-head">
    <div class="title-wrap">
      <p class="page-desc">진행 중인 설문을 확인하고 응답할 수 있어요.</p>
      <div th:replace="${sampleData} ? ~{fragments/trainee :: sampleNotice} : ~{}"></div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-left">
      <div class="control inline">
        <label class="control-label" for="slStatus">상태</label>
        <select id="slStatus" class="control-input">
          <option value="ALL">전체</option>
          <option value="ONGOING">진행중</option>
          <option value="SUBMITTED">제출완료</option>
          <option value="CLOSED_UNANSWERED">종료(미응답)</option>
          <option value="SCHEDULED">예정</option>
        </select>
      </div>

      <div class="control inline">
        <label class="control-label" for="slCourse">과정</label>
        <select id="slCourse" class="control-input">
          <option value="ALL">전체</option>
        </select>
      </div>

      <div class="control inline">
        <label class="control-label" for="slStart">기간</label>
        <div class="date-range">
          <input type="date" id="slStart" class="control-input" />
          <span class="date-sep">~</span>
          <input type="date" id="slEnd" class="control-input" />
        </div>
      </div>

      <div class="control inline">
        <label class="control-label" for="slKeyword">검색</label>
        <input type="text" id="slKeyword" class="control-input" placeholder="설문 제목 검색" />
        <button type="button" style="width: 120px;" class="btn btn-gray" id="slReset">초기화</button>
        <button type="button" style="width: 140px;" class="btn btn-secondary" id="slSearch">검색하기</button>
      </div>
    </div>

    <div class="filter-right">
      <div class="control inline">
        <label class="control-label" for="slSort">정렬</label>
        <select id="slSort" class="control-input">
          <option value="DUE_SOON">마감 임박순</option>
          <option value="DUE_LATE">마감 여유순</option>
          <option value="NEWEST">최신 생성순</option>
        </select>
      </div>

    </div>
  </div>

  <div class="table-wrap">
    <table class="basic-table survey-table">
      <thead>
        <tr>
          <th style="width:80px;">번호</th>
          <th>설문 제목</th>
          <th style="width:220px;">과정/기수</th>
          <th style="width:240px;">응답기간</th>
          <th style="width:100px;">문항수</th>
          <th style="width:140px;">상태</th>
          <th style="width:140px;">액션</th>
        </tr>
      </thead>
      <tbody id="slTbody"></tbody>
    </table>

    <div class="empty-state" id="slEmpty" style="display:none;">
      <p class="empty-title">표시할 설문이 없어요.</p>
      <p class="empty-desc">필터 조건을 변경해보세요.</p>
    </div>

    <div class="list-hint" id="slHint">-</div>
  </div>

</div>


			
		</section>
    <!-- 플로팅 메뉴 (AI 챗봇) -->
        <div class="floating-chatbot-btn" id="floatingChatbotBtn">
            <img src="/static/img/chatbot.png" alt="AI 헬피 챗봇">
            <span class="chatbot-hint">AI 헬피 챗봇</span>
        </div>

        <!-- Floating Chatbot Window -->
        <div class="floating-chatbot-window" id="floatingChatbotWindow" style="display:none;">
            <div class="chatbot-header">
                <span>AI 헬피 챗봇</span>
                <button class="chatbot-close-btn" id="chatbotCloseBtn" title="닫기">×</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="chatbot-msg chatbot-msg-bot">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>
            <div class="chatbot-badge-row" style="padding-left: 15px; display:flex; gap:7px; flex-wrap:wrap;background-color: #f7faff;">
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">출결 확인</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">과제 마감</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">시험 일정</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">Q&A 문의</span>
            </div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbotInput" class="chatbot-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                <button id="chatbotSendBtn" class="chatbot-send-btn">전송</button>
            </div>
        </div>
	</main>
<!-- 푸터 ********************************************************************************************************* -->
    <footer th:replace="~{fragments/trainee :: footer}"></footer>
<style>
    /* ===== simple footer ===== */
.simple-footer{

  padding:14px 18px;
  border-top:1px solid var(--gray-200);
  background:#fff;
  position: relative;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--gray-500);
  font-weight:700;
}

.footer-link{
  color:var(--gray-500);
  text-decoration:none;
}
.footer-link:hover{
  text-decoration:underline;
}

.footer-dot{
  margin:0 6px;
  color:var(--gray-300);
}

@media (max-width:640px){
  .footer-inner{
    flex-direction:column;
    gap:6px;
  }
}

</style>
	
    <!-- ===== 서버 연동 (개발자 B) ===== -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        // 화면 JS 가 기대하는 필드명으로 매핑 (DTO 필드명과 다름)
        window._serverTraineeSurveys = (/*[[${rows}]]*/ []).map(function (r) {
            return {
                id: r.id, title: r.title, course: r.course, cohort: r.cohort,
                startAt: r.startAt, endAt: r.endAt,
                questionCount: r.questionCount, status: r.status
            };
        });
        /*]]>*/
    </script>
</body>
</html>
