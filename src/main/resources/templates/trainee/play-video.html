<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF (진도 저장 AJAX POST 용) -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${content.title} + ' - 학습 콘텐츠'">수업 콘텐츠</title>
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <link rel="stylesheet" href="/static/css/play-video.css">
    <link rel="stylesheet" href="/static/css/play.css">
    <script src="/static/js/play-video.js" defer></script>
</head>
<body data-user-role="trainee">
    <header th:replace="~{fragments/trainee :: header('contents')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap flex-between">
                <h2>학습 콘텐츠 &gt; 이론 학습(VOD)</h2>
            </div>
        </section>
        <section class="main-content">
            <section class="main-content-inner main-wrap">
                <div class="content-header">
                    <div class="content-breadcrumb">
                        <div class="breadcrumb-item">
                            <span class="breadcrumb-label">과정명</span>
                            <span class="breadcrumb-value" th:text="${content.courseName}">과정명</span>
                        </div>
                        <span class="breadcrumb-separator" th:if="${content.sessionName != null}">›</span>
                        <div class="breadcrumb-item" th:if="${content.sessionName != null}">
                            <span class="breadcrumb-label">차시</span>
                            <span class="breadcrumb-value" th:text="${content.sessionName}">차시명</span>
                        </div>
                        <span class="breadcrumb-separator">›</span>
                        <div class="breadcrumb-item">
                            <span class="breadcrumb-label">콘텐츠명</span>
                            <span class="breadcrumb-value" th:text="${content.title}">콘텐츠명</span>
                        </div>
                    </div>
                    <span>동영상<span th:if="${content.durationLabel != '-'}" th:text="' / ' + ${content.durationLabel}"></span></span>
                </div>

                <div class="content-container"
                     th:attr="data-content-id=${content.id},
                              data-duration=${content.durationSeconds != null ? content.durationSeconds : 0},
                              data-resume=${progress.lastPositionSeconds != null ? progress.lastPositionSeconds : 0}">
                    <div class="video-container">
                        <div class="video-player">
                            <!-- poster 는 예시 콘텐츠에만 붙는다(재생할 파일이 없어 검은 상자로 뜨는 것을 막는다).
                                 실제 콘텐츠는 posterUrl 이 없어 속성 자체가 렌더되지 않는다. -->
                            <video id="videoPlayer" controls th:attr="poster=${posterUrl}">
                                <source th:if="${content.fileUrl != null}" th:src="${content.fileUrl}" type="video/mp4">
                                브라우저가 비디오를 지원하지 않습니다.
                            </video>
                        </div>
                        <div class="video-controls">
                            <div class="progress-container" id="progressContainer">
                                <div class="progress-bar" id="progressBar"></div>
                                <div class="progress-handle" id="progressHandle"></div>
                            </div>
                            <div class="controls-row">
                                <div class="controls-left">
                                    <button class="control-btn" id="playPauseBtn">
                                        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        <svg id="pauseIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
                                    </button>
                                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                                </div>
                                <div class="controls-right">
                                    <select class="speed-select" id="speedSelect">
                                        <option value="0.5">0.5x</option>
                                        <option value="1" selected>1x</option>
                                        <option value="1.25">1.25x</option>
                                        <option value="1.5">1.5x</option>
                                        <option value="2">2x</option>
                                    </select>
                                    <div class="volume-container">
                                        <button class="control-btn" id="volumeBtn">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                        </button>
                                        <div class="volume-slider" id="volumeSlider"><div class="volume-level" id="volumeLevel"></div></div>
                                    </div>
                                    <button class="control-btn" id="fullscreenBtn">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="button-container" style="margin-top:20px; display:flex; gap:12px; justify-content:center; align-items:center;">
                    <span id="progressStatus" style="color:var(--color-primary);">진도율 <span th:text="${progress.progressRate}">0</span>%</span>
                    <button id="saveExitBtn" class="big-btn btn-secondary" data-user-role="trainee">학습진도 저장하고 나가기</button>
                </div>
            </section>
        </section>
    </main>

    <script th:inline="none">
    (function () {
        var container = document.querySelector('.content-container');
        var video = document.getElementById('videoPlayer');
        if (!container || !video) return;

        var contentId = container.getAttribute('data-content-id');
        var resume = parseInt(container.getAttribute('data-resume') || '0', 10);
        var metaDuration = parseInt(container.getAttribute('data-duration') || '0', 10);
        var csrfToken = (document.querySelector('meta[name="_csrf"]') || {}).content;
        var csrfHeader = (document.querySelector('meta[name="_csrf_header"]') || {}).content;
        var statusEl = document.getElementById('progressStatus');
        // 예시 콘텐츠는 진도를 저장하지 않는다 — 서버도 막지만, 굳이 요청을 보낼 이유가 없다.
        var isSample = container.getAttribute('data-sample') === 'true';

        // 이어보기: 저장된 위치로 이동
        video.addEventListener('loadedmetadata', function () {
            if (resume > 0 && resume < video.duration) {
                video.currentTime = resume;
            }
        });

        function sendProgress() {
            if (isSample || !contentId || isNaN(video.currentTime)) return;
            var duration = (video.duration && isFinite(video.duration)) ? Math.round(video.duration) : metaDuration;
            var headers = { 'Content-Type': 'application/json' };
            if (csrfHeader) headers[csrfHeader] = csrfToken;
            return fetch('/trainee/contents/' + contentId + '/progress', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    positionSeconds: Math.round(video.currentTime),
                    durationSeconds: duration
                })
            }).then(function (r) { return r.ok ? r.json() : null; })
              .then(function (data) {
                  if (data && statusEl) {
                      statusEl.innerHTML = '진도율 ' + data.progressRate + '%' + (data.completed ? ' (완료)' : '');
                  }
              }).catch(function () { /* 네트워크 오류 무시 */ });
        }

        // 10초마다 + 일시정지/종료 시 저장
        var timer = setInterval(function () { if (!video.paused) sendProgress(); }, 10000);
        video.addEventListener('pause', sendProgress);
        video.addEventListener('ended', sendProgress);
        window.addEventListener('beforeunload', sendProgress);

        document.getElementById('saveExitBtn').addEventListener('click', function () {
            clearInterval(timer);
            Promise.resolve(sendProgress()).then(function () {
                window.location.href = '/trainee/learning';
            });
        });
    })();
    </script>
</body>
</html>
