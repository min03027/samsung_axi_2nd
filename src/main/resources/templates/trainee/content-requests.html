<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>추가 콘텐츠 요청</title>
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css?v=20260825-3">
    <link rel="stylesheet" href="/static/css/content-operations.css?v=20260825-2">
</head>
<body>
<header th:replace="~{fragments/trainee :: header('contents')}"></header>
<main class="ops-shell">
    <div class="ops-head">
        <div>
            <span class="ops-kicker">LEARNER REQUEST</span>
            <h1>학습에 필요한 콘텐츠를 요청하세요</h1>
            <p>보충 설명, 실습 자료, 영상 등 필요한 주제를 남기면 담당자가 검토 결과를 이 화면에 안내합니다.</p>
        </div>
    </div>
    <div class="ops-message" th:if="${message}" th:text="${message}"></div>
    <div class="ops-grid">
        <section class="ops-card">
            <h2>내 요청 내역</h2>
            <div class="ops-table-wrap">
                <table class="ops-table">
                    <thead><tr><th>과정·요청</th><th>유형</th><th>상태</th><th>처리 결과</th></tr></thead>
                    <tbody>
                    <tr th:each="row : ${rows}">
                        <td>
                            <strong th:text="${row.title}"></strong>
                            <small th:text="${row.courseName + ' · ' + #temporals.format(row.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                        </td>
                        <td th:text="${row.preferredType}"></td>
                        <td><span class="ops-badge" th:classappend="${row.status}" th:text="${row.statusLabel}"></span></td>
                        <td th:text="${row.fulfilledTitle != null ? row.fulfilledTitle : (row.decisionNote != null ? row.decisionNote : '검토 중입니다.')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}"><td colspan="4" class="ops-empty">아직 요청한 콘텐츠가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <aside class="ops-card">
            <h2>새 요청</h2>
            <form class="ops-form" th:action="@{/trainee/content-requests}" method="post" th:object="${form}">
                <label>대상 과정
                    <select class="ops-select" th:field="*{courseId}">
                        <option value="">선택</option>
                        <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"></option>
                    </select>
                    <small th:errors="*{courseId}"></small>
                </label>
                <label>선호 유형
                    <select class="ops-select" th:field="*{preferredType}">
                        <option value="">유형 무관</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                    </select>
                </label>
                <label>필요한 주제
                    <input class="ops-input" th:field="*{title}" placeholder="예: Tableau 대시보드 실습">
                    <small th:errors="*{title}"></small>
                </label>
                <label>요청 이유
                    <textarea class="ops-textarea" th:field="*{reason}" placeholder="어떤 부분을 보완하고 싶은지 적어주세요."></textarea>
                    <small th:errors="*{reason}"></small>
                </label>
                <button class="ops-btn primary" type="submit">요청 접수</button>
            </form>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
