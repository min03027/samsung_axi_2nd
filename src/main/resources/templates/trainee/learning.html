<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <title>학습 콘텐츠 - 차시별 학습</title>
    <style>
        .accordion { border:1px solid var(--gray-200); border-radius:8px; margin-bottom:12px; overflow:hidden; }
        .accordion-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; cursor:pointer; background:var(--gray-50); }
        .accordion-content { display:none; padding:8px 20px 16px; }
        .accordion.open .accordion-content { display:block; }
        .content-li { display:flex; align-items:center; gap:12px; padding:10px; border-bottom:1px solid var(--gray-200); }
        .prog-badge { font-size:14px; color:var(--color-primary); min-width:44px; text-align:right; }
        .content-title { flex:1; min-width:0; }
        .course-select-bar { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .course-progress-pill { margin-left:auto; font-weight:600; color:var(--color-primary); }
        .continue-card { display:flex; align-items:center; gap:18px; margin-bottom:20px; padding:20px 22px; border:1px solid var(--gray-200); border-radius:12px; background:var(--gray-50); }
        .continue-card-copy { flex:1; min-width:0; }
        .continue-card-kicker { display:block; margin-bottom:5px; color:var(--color-primary); font-size:14px; font-weight:700; }
        .continue-card-title { display:block; font-size:18px; line-height:1.45; }
        .continue-card-meta { margin-top:5px; color:var(--gray-500); font-size:14px; }

        /* 좁은 폭 — 한 줄에 [아이콘][제목][진도][상태][버튼] 5개가 몰리면 제목만 짓눌린다.
           고정 요소가 약 264px(아이콘 40 + 진도 44 + 상태배지 50 + 버튼 82 + gap)라
           375px 에서 제목에 43px 밖에 안 남아 글자가 세로로 흘렀다.
           제목을 첫 줄에 통째로 두고 나머지를 아랫줄로 내린다. */
        @media (max-width: 768px) {
            .content-li { flex-wrap: wrap; gap: 8px 12px; }
            .content-title { flex: 1 1 calc(100% - 52px); }   /* 아이콘 40 + gap 12 */
            .prog-badge { margin-left: 52px; text-align: left; }  /* 아이콘 폭만큼 들여쓰기 */
            .content-li .btn { margin-left: auto; }
        }

        @media (max-width: 480px) {
            .accordion-header { padding: 14px 14px; }
            .accordion-content { padding: 8px 12px 14px; }
            .course-select-bar select { max-width: 100%; }
            .course-progress-pill { margin-left: 0; }   /* 줄바꿈되면 오른쪽 끝에 떠 보인다 */
            .continue-card { align-items:flex-start; flex-direction:column; }
        }
    </style>
</head>
<body data-user-role="trainee">
    <header th:replace="~{fragments/trainee :: header('contents')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap flex-between">
                <h2>학습 콘텐츠 &gt; 차시별 학습</h2>
            </div>
        </section>

        <section class="main-content">
            <section class="main-content-inner main-wrap">
                <!-- 과정 선택 -->
                <form method="get" th:action="@{/trainee/learning}" class="course-select-bar">
                    <label>과정 선택</label>
                    <select class="input" name="courseId" onchange="this.form.submit()">
                        <option value="">-- 과정 선택 --</option>
                        <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.courseName}"
                                th:selected="${selectedCourseId != null and selectedCourseId == c.id}">과정</option>
                    </select>
                    <span class="course-progress-pill">전체 진도율 <span th:text="${courseProgress}">0</span>%</span>
                </form>

                <section class="continue-card" th:if="${nextLearning != null}">
                    <div class="continue-card-copy">
                        <span class="continue-card-kicker">이어서 학습</span>
                        <strong class="continue-card-title" th:text="${nextLearning.title}">다음 콘텐츠</strong>
                        <div class="continue-card-meta">
                            <span th:text="${nextLearning.sessionName}">차시</span>
                            <span> · 현재 </span><span th:text="${nextLearning.progressRate} + '%'">0%</span>
                        </div>
                    </div>
                    <a class="btn btn-primary"
                       th:href="@{/trainee/contents/{id}/play(id=${nextLearning.contentId})}">바로 이어서 학습</a>
                </section>

                <p th:if="${selectedCourseId != null and nextLearning == null and not #lists.isEmpty(groups)}"
                   style="margin:0 0 20px;color:var(--gray-500);">
                    이 과정의 등록된 학습 콘텐츠를 모두 완료했어요.
                </p>

                <p th:if="${#lists.isEmpty(courses)}" style="color:var(--gray-500);">학습 중인(승인된) 과정이 없습니다.</p>
                <p th:if="${selectedCourseId != null and #lists.isEmpty(groups)}" style="color:var(--gray-500);">
                    등록된 학습 콘텐츠가 없습니다.</p>

                <!-- 차시별 아코디언 -->
                <div class="subject-container">
                    <div class="accordion open" th:each="g : ${groups}">
                        <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">
                            <div>
                                <span th:text="${g.sessionName}">차시명</span>
                                <div style="font-size:13px; margin-top:4px; color:var(--gray-800);">
                                    <span><strong>진도율</strong>
                                        <span style="color:var(--color-primary);" th:text="${g.avgProgress} + '%'">0%</span></span>
                                    <span style="margin-left:16px;"><strong>콘텐츠</strong>
                                        <span th:text="${#lists.size(g.contents)}">0</span>개</span>
                                </div>
                            </div>
                            <span aria-hidden="true">▾</span>
                        </div>
                        <div class="accordion-content">
                            <ul style="list-style:none; padding:0; margin:0;">
                                <li class="content-li" th:each="c : ${g.contents}">
                                    <img th:src="${c.type.name() == 'VIDEO'} ? '/static/icons/content-video.png' : '/static/icons/content-document.png'"
                                         alt="유형" style="width:40px;height:40px;object-fit:contain;">
                                    <span class="content-title">
                                        <span th:text="${c.title}">콘텐츠명</span>
                                        <span style="font-size:14px;color:var(--gray-500);margin-left:8px;"
                                              th:if="${c.durationMinutes > 0}" th:text="${c.durationMinutes} + '분'">분</span>
                                    </span>
                                    <span class="prog-badge" th:text="${c.progressRate} + '%'">0%</span>
                                    <span class="status-badge"
                                          th:classappend="${c.completed} ? 'status-completed' : 'status-in-progress'"
                                          th:text="${c.completed} ? '완료' : '진행중'">진행중</span>
                                    <a class="btn" th:classappend="${c.completed} ? 'btn-gray' : 'btn-secondary'"
                                       th:href="@{/trainee/contents/{id}/play(id=${c.contentId})}"
                                       th:text="${c.completed} ? '다시보기' : '학습하기'">학습하기</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
