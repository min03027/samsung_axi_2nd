<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <title>Samsung Academy LXP - 학습 콘텐츠</title>
    <style>
        .content-li { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--gray-200); }
        .content-course { font-size:13px; color:var(--gray-600); }
        .prog-badge { font-size:14px; color:var(--color-primary); min-width:44px; text-align:right; }
        .content-title { flex:1; min-width:0; }

        /* 차시별 학습(learning.html)과 같은 행 구조라 같은 처리를 한다.
           375px 에서 "학습하기" 버튼이 화면 밖(311~393px)으로 나가 누를 수 없었다. */
        @media (max-width: 768px) {
            .content-li { flex-wrap: wrap; gap: 8px 12px; }
            .content-title { flex: 1 1 calc(100% - 54px); }   /* 아이콘 42 + gap 12 */
            .prog-badge { margin-left: 54px; text-align: left; }
            .content-li .btn { margin-left: auto; }
        }
    </style>
</head>
<body data-user-role="trainee">
    <header th:replace="~{fragments/trainee :: header('contents')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap flex-between">
                <h2>학습 콘텐츠</h2>
            </div>
        </section>
        <section class="main-content">
            <section class="main-content-inner main-wrap">
                <p th:if="${#lists.isEmpty(contents)}" style="color:var(--gray-500);">학습 가능한 콘텐츠가 없습니다.</p>
                <ul style="list-style:none; padding:0; margin:0;">
                    <li class="content-li" th:each="c : ${contents}">
                        <img th:src="${c.type.name() == 'VIDEO'} ? '/static/icons/content-video.png' : '/static/icons/content-document.png'"
                             alt="유형" style="width:42px;height:42px;object-fit:contain;">
                        <span class="content-title">
                            <span class="content-course" th:text="${c.courseName} + (${c.sessionName != null} ? ' > ' + ${c.sessionName} : '')">과정 &gt; 차시</span><br>
                            <span th:text="${c.title}">콘텐츠명</span>
                            <span style="font-size:14px;color:var(--gray-500);margin-left:8px;"
                                  th:if="${c.durationMinutes > 0}" th:text="${c.durationMinutes} + '분'">분</span>
                        </span>
                        <span class="prog-badge" th:text="${c.progressRate} + '%'">0%</span>
                        <span class="status-badge"
                              th:classappend="${c.completed} ? 'status-completed' : 'status-in-progress'"
                              th:text="${c.completed} ? '완료' : '진행중'">진행중</span>
                        <a class="btn" th:classappend="${c.completed} ? 'btn-gray' : 'btn-secondary'"
                           th:href="@{/trainee/contents/{id}/play(id=${c.contentId})}"
                           th:text="${c.completed} ? '다시보기' : '학습하기'">학습하기</a>
                    </li>
                </ul>
            </section>
        </section>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
