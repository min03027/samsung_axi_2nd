<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/chatbot.css">
  <script src="/static/js/chatbot.js" defer></script>
	<link rel="stylesheet" href="/static/css/basic-form-trainee.css">
	<link rel="stylesheet" href="/static/css/btn-style.css">
	<link rel="stylesheet" href="/static/css/trainee/assignments.css">

  <style>
    :root{
      --bg: #F6F7FB;
      --card: #FFFFFF;
      --text: #101828;
      --muted: #667085;
      --border: #E4E7EC;
      --shadow: 0 8px 20px rgba(16,24,40,.06);
      --radius: 16px;

      /* Type tokens (subtle) */
      --info-bg: #EEF4FF;
      --info-bd: #D1E0FF;

      --rec-bg: #FFF7E6;
      --rec-bd: #FFE3A3;

      --warn-bg: #FFF1F3;
      --warn-bd: #FFD1DC;

      --brand: #2045C7;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== Page frame: 100vw + fixed height ===== */
    .page{
      width: 100%;
      height: 100vh; /* 고정 높이(뷰포트 기준) */
      display: flex;
      flex-direction: column;
    }

    .topbar{
      padding: 20px 0px 14px;
    }

    .title-row{
      display:flex;
      align-items:flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    h1{
      font-size: 20px;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .subtitle{
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .controls{
      display:flex;
      align-items:end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .tabs{
      display:flex;
      gap: 8px;
      align-items:center;
      flex-wrap: wrap;
    }
    .tab{
      border: 1px solid var(--border);
      background: rgba(255,255,255,.7);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .tab.active{
      background: #fff;
      border-color: rgba(32,69,199,.25);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(32,69,199,.08);
    }

    .right-controls{
      display:flex;
      gap: 10px;
      align-items:center;
      /* flex-wrap: wrap; */
      justify-content: flex-end;
    }

    .search{
      position: relative;
      min-width: 220px;
      flex: 0 1 280px;
    }
    .search input{
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.85);
      font-size: 13px;
      outline: none;
    }
    .search input:focus{
      border-color: rgba(32,69,199,.35);
      box-shadow: 0 0 0 4px rgba(32,69,199,.10);
      background: #fff;
    }

    .select{
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.85);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .toggle{
      display:flex;
      gap: 8px;
      align-items:center;
      font-size: 13px;
      color: var(--muted);
      user-select: none;
      white-space: nowrap;
    }
    .toggle input{ width: 16px; height: 16px; accent-color: var(--brand); }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,.7);
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }
    .dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--brand);
      display:inline-block;
    }

    /* ===== Content split: top horizontal cards + bottom detail ===== */
    .content{
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0; /* allow children scroll */
    }

    /* Horizontal card rail */
    .rail-wrap{
      position: relative;
      min-height: 210px;
    }

    .rail{
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      min-height: 170px;
    }
    .rail::-webkit-scrollbar{ height: 10px; }
    .rail::-webkit-scrollbar-thumb{
      background: var(--color-primary);
      border-radius: 999px;
    }
    .rail::-webkit-scrollbar-track{
      background: transparent;
      border-radius: 999px;
    }

    .arrow{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px; height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      box-shadow: 0 6px 16px rgba(16,24,40,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      user-select: none;
    }
    .arrow:active{ transform: translateY(-50%) scale(.98); }
    .arrow.left{ left: 10px; }
    .arrow.right{ right: 10px; }
    .arrow.disabled{
      opacity: .4;
      cursor: default;
      box-shadow: none;
    }

    .card{
      flex: 0 0 240px;
      height: 170px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 12px 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(16,24,40,.06);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .card:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(16,24,40,.09);
    }
    .card.selected{
      border-color: rgba(32,69,199,.35);
      box-shadow: 0 10px 24px rgba(32,69,199,.15);
      transform: translateY(-1px);
    }

    .card-top{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 8px;
    }

    .type-pill{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(16,24,40,.02);
      color: var(--muted);
      white-space: nowrap;
    }
    .type-pill .mini-dot{
      width: 6px; height: 6px; border-radius: 999px;
      background: var(--muted);
      display:inline-block;
    }

    .unread-mark{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      font-size: 12px;
      color: var(--brand);
      white-space: nowrap;
    }
    .unread-mark .mini-dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--brand);
    }

    .card-title{
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }
    .card-snippet{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }
    .card-meta{
      margin-top: auto;
      display:flex;
      align-items:center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      padding-top: 8px;
      border-top: 1px dashed rgba(102,112,133,.25);
    }

    /* Detail panel */
    .detail{
      flex: 1 1 auto;
      min-height: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-head{
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title{
      display:flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .detail-title h2{
      font-size: 16px;
      margin: 0;
      letter-spacing: -0.2px;
      line-height: 1.35;
      word-break: keep-all;
    }
    .detail-sub{
      font-size: 13px;
      color: var(--muted);
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .detail-body{
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .section{
      display:flex;
      flex-direction: column;
      gap: 8px;
    }
    .label{
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .text{
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-line;
    }

    .chips{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip{
      font-size: 12px;
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(16,24,40,.02);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
    }
    .chip:hover{
      border-color: rgba(32,69,199,.25);
      box-shadow: 0 6px 14px rgba(32,69,199,.08);
    }

    .detail-actions{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      align-items:center;
      flex-wrap: wrap;
    }
    .btn{
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
    }
    .btn.primary{
      border-color: rgba(32,69,199,.35);
      background: rgba(32,69,199,.06);
      color: var(--text);
    }
    .btn:active{ transform: translateY(1px); }

    .empty{
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color: var(--muted);
      font-size: 14px;
      padding: 16px;
    }

    /* Subtle type accents */
    .accent-info{ background: var(--info-bg); border-color: var(--info-bd); }
    .accent-rec{ background: var(--rec-bg); border-color: var(--rec-bd); }
    .accent-warn{ background: var(--warn-bg); border-color: var(--warn-bd); }

    @media (max-width: 760px){
      .topbar{ padding: 18px 16px 12px; }
      .content{ padding: 0 16px 14px; }
      .rail-wrap{ padding: 14px 40px; }
      .card{ flex-basis: 220px; }
      .search{ min-width: 180px; }
    }
  </style>

<script th:inline="javascript">
    /*<![CDATA[*/

  <script>
    // 서버(Thymeleaf)가 내려준 알림만 쓴다.
    // 예전에는 여기에 더미 6건("홍길동" 등)이 폴백으로 있었다. 이 화면에는 @Profile 조건이 없어
    // 운영에서 서버 데이터가 비면 그대로 노출됐다. 비면 빈 상태 문구를 띄우도록 폴백을 지웠다.
    const feedbackData = window._serverAlarms || [];

    // ===== State =====
    let state = {
      filter: "all",        // all | info | rec | warn
      unreadOnly: false,
      search: "",
      sort: "newest",       // newest | oldest
      selectedId: null
    };

    // ===== DOM =====
    const railEl = document.getElementById("cardRail");
    const detailPanel = document.getElementById("detailPanel");
    const detailEmpty = document.getElementById("detailEmpty");
    const summaryBadge = document.getElementById("summaryBadge");

    const tabs = Array.from(document.querySelectorAll(".tab"));
    const unreadOnlyEl = document.getElementById("unreadOnly");
    const searchInputEl = document.getElementById("searchInput");
    const sortSelectEl = document.getElementById("sortSelect");

    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");

    // ===== Helpers =====
    function typeLabel(type){
      if(type === "info") return "안내";
      if(type === "rec") return "권장";
      return "주의";
    }
    function typeIcon(type){
      if(type === "info") return "ℹ️";
      if(type === "rec") return "📌";
      return "⚠️";
    }
    function formatDate(iso){
      const d = new Date(iso);
      const yy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mi = String(d.getMinutes()).padStart(2,"0");
      return `${yy}.${mm}.${dd} ${hh}:${mi}`;
    }
    function normalize(s){ return (s || "").toLowerCase().trim(); }

    function getFilteredList(){
      let list = [...feedbackData];

      // filter by type
      if(state.filter !== "all"){
        list = list.filter(x => x.type === state.filter);
      }

      // unread only
      if(state.unreadOnly){
        list = list.filter(x => !x.read);
      }

      // search
      const q = normalize(state.search);
      if(q){
        list = list.filter(x => {
          const hay = normalize(`${x.title} ${x.message} ${x.authorRole} ${x.authorName}`);
          return hay.includes(q);
        });
      }

      // sort
      list.sort((a,b) => {
        const ta = new Date(a.createdAt).getTime();
        const tb = new Date(b.createdAt).getTime();
        return state.sort === "newest" ? (tb - ta) : (ta - tb);
      });

      return list;
    }

    function updateSummary(){
      const unreadCount = feedbackData.filter(x => !x.read).length;
      summaryBadge.innerHTML = `<span class="dot"></span> 미확인 ${unreadCount}`;
    }

    function cardAccentClass(type){
      if(type === "info") return "accent-info";
      if(type === "rec") return "accent-rec";
      return "accent-warn";
    }

    function ensureSelection(list){
      // If current selection not in list, select first item (prefer unread)
      const exists = list.some(x => x.id === state.selectedId);
      if(exists) return;

      const firstUnread = list.find(x => !x.read);
      const first = firstUnread || list[0] || null;
      state.selectedId = first ? first.id : null;
    }

    function renderCards(){
      const list = getFilteredList();
      ensureSelection(list);

      railEl.innerHTML = "";

      if(list.length === 0){
        // 알림 자체가 없는 경우와 필터에 걸리는 게 없는 경우를 구분해서 안내한다.
        railEl.innerHTML = `
          <div class="empty" style="width:100%; padding:24px;">
            ${feedbackData.length === 0 ? "알림이 없습니다." : "조건에 맞는 피드백이 없습니다."}
          </div>
        `;
        renderDetail(null);
        updateArrows();
        return;
      }

      for(const item of list){
        const isSelected = item.id === state.selectedId;
        const unread = !item.read;

        const card = document.createElement("div");
        card.className = `card ${isSelected ? "selected" : ""}`;
        card.setAttribute("data-id", item.id);

        card.innerHTML = `
          <div class="card-top">
            <span class="type-pill ${cardAccentClass(item.type)}" title="${typeLabel(item.type)}">
              <span class="mini-dot"></span> ${typeIcon(item.type)} ${typeLabel(item.type)}
            </span>
            ${unread ? `<span class="unread-mark"><span class="mini-dot"></span>미확인</span>` : `<span style="font-size:12px;color:var(--muted);">확인</span>`}
          </div>

          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-snippet">${escapeHtml(item.message)}</div>

          <div class="card-meta">
            <span>${escapeHtml(item.authorRole)} · ${escapeHtml(item.authorName)}</span>
            <span>${formatDate(item.createdAt).slice(2, 12)}</span>
          </div>
        `;

        card.addEventListener("click", () => {
          state.selectedId = item.id;
          renderCards();     // re-render to update selected style
          renderDetail(item);
          // keep selected card in view
          card.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
        });

        railEl.appendChild(card);
      }

      // Render detail for selected
      const selected = feedbackData.find(x => x.id === state.selectedId) || list[0];
      renderDetail(selected);
      updateArrows();
    }

    function renderDetail(item){
      detailPanel.innerHTML = "";
      if(!item){
        detailPanel.appendChild(detailEmpty);
        return;
      }

      const head = document.createElement("div");
      head.className = "detail-head";

      head.innerHTML = `
        <div class="detail-title">
          <h2>[${typeLabel(item.type)} 기록] ${escapeHtml(item.title)}</h2>
          <div class="detail-sub">
            <span>등록자: ${escapeHtml(item.authorRole)} · ${escapeHtml(item.authorName)}</span>
            <span>등록일: ${formatDate(item.createdAt)}</span>
            <span>상태: ${item.read ? "확인" : "미확인"}</span>
          </div>
        </div>
      `;

      const body = document.createElement("div");
      body.className = "detail-body";

      const contentSection = document.createElement("div");
      contentSection.className = "section";
      contentSection.innerHTML = `
        <div class="label">내용</div>
        <div class="text">${escapeHtml(item.message)}</div>
      `;

      const relatedSection = document.createElement("div");
      relatedSection.className = "section";
      relatedSection.innerHTML = `<div class="label">관련 항목</div>`;

      const chips = document.createElement("div");
      chips.className = "chips";

      if(item.related?.length){
        for(const r of item.related){
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.textContent = r.label;
          chip.addEventListener("click", () => {
            // 실제 환경에서는 location.href 또는 라우팅 연결
            alert(`'${r.label}' 화면으로 이동합니다.`);
          });
          chips.appendChild(chip);
        }
      } else {
        const emptyChip = document.createElement("div");
        emptyChip.style.color = "var(--muted)";
        emptyChip.style.fontSize = "13px";
        emptyChip.textContent = "연결된 항목이 없습니다.";
        relatedSection.appendChild(emptyChip);
      }
      relatedSection.appendChild(chips);

      body.appendChild(contentSection);
      body.appendChild(relatedSection);

      const actions = document.createElement("div");
      actions.className = "detail-actions";

      const leftActions = document.createElement("div");
      leftActions.style.display = "flex";
      leftActions.style.gap = "10px";
      leftActions.style.flexWrap = "wrap";

      const btnPrimary = document.createElement("button");
      btnPrimary.className = "btn primary";
      btnPrimary.type = "button";
      btnPrimary.textContent = "확인";
      btnPrimary.addEventListener("click", () => {
        item.read = true;
        updateSummary();
        renderCards();
      });

      const btnCopy = document.createElement("button");
      btnCopy.className = "btn";
      btnCopy.type = "button";
      btnCopy.textContent = "내용 복사";
      btnCopy.addEventListener("click", async () => {
        try{
          await navigator.clipboard.writeText(`${item.title}\n\n${item.message}`);
          toast("복사되었습니다.");
        }catch(e){
          alert("복사에 실패했습니다. (브라우저 권한 확인)");
        }
      });

      leftActions.appendChild(btnCopy);
      actions.appendChild(leftActions);
      actions.appendChild(btnPrimary);

      detailPanel.appendChild(head);
      detailPanel.appendChild(body);
      detailPanel.appendChild(actions);
    }

    // ===== Scroll arrows =====
    function updateArrows(){
      const el = railEl;
      const maxScrollLeft = el.scrollWidth - el.clientWidth;
      const atStart = el.scrollLeft <= 0;
      const atEnd = el.scrollLeft >= maxScrollLeft - 1;

      btnLeft.classList.toggle("disabled", atStart);
      btnRight.classList.toggle("disabled", atEnd);
    }

    function scrollRailBy(delta){
      if(delta === 0) return;
      railEl.scrollBy({ left: delta, behavior: "smooth" });
      setTimeout(updateArrows, 120);
    }

    btnLeft.addEventListener("click", () => {
      if(btnLeft.classList.contains("disabled")) return;
      scrollRailBy(-280);
    });
    btnRight.addEventListener("click", () => {
      if(btnRight.classList.contains("disabled")) return;
      scrollRailBy(280);
    });

    railEl.addEventListener("scroll", () => updateArrows());

    // Trackpad vertical wheel -> horizontal scroll (nice UX)
    railEl.addEventListener("wheel", (e) => {
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        e.preventDefault();
        railEl.scrollLeft += e.deltaY;
        updateArrows();
      }
    }, { passive: false });

    // ===== Events =====
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        state.filter = tab.dataset.filter;
        // set aria-selected
        tabs.forEach(t => t.setAttribute("aria-selected", t.classList.contains("active") ? "true" : "false"));

        renderCards();
      });
    });

    unreadOnlyEl.addEventListener("change", () => {
      state.unreadOnly = unreadOnlyEl.checked;
      renderCards();
    });

    searchInputEl.addEventListener("input", () => {
      state.search = searchInputEl.value;
      renderCards();
    });

    sortSelectEl.addEventListener("change", () => {
      state.sort = sortSelectEl.value;
      renderCards();
    });

    // ===== Toast (tiny) =====
    let toastTimer = null;
    function toast(msg){
      const el = document.createElement("div");
      el.textContent = msg;
      el.style.position = "fixed";
      el.style.left = "50%";
      el.style.bottom = "18px";
      el.style.transform = "translateX(-50%)";
      el.style.background = "rgba(16,24,40,.92)";
      el.style.color = "#fff";
      el.style.padding = "10px 12px";
      el.style.borderRadius = "12px";
      el.style.fontSize = "13px";
      el.style.zIndex = "9999";
      el.style.boxShadow = "0 12px 26px rgba(16,24,40,.25)";
      document.body.appendChild(el);

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.remove(), 1400);
    }

    // ===== Security helpers =====
    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // ===== Init =====
    function init(){
      updateSummary();

      // Default: select newest unread if exists
      const sortedNewest = [...feedbackData].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const firstUnread = sortedNewest.find(x => !x.read);
      state.selectedId = (firstUnread || sortedNewest[0] || null)?.id ?? null;

      renderCards();
      updateArrows();
    }
    init();
  </script>

</body>
</html>
