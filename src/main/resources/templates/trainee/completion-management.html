<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/trainee/completion-management.css">
    <title>Samsung Academy LXP - 이수관리</title>
    <style>
        table.completion-table { border-collapse:collapse; width:100%; font-size:14px; }
        table.completion-table th, table.completion-table td { border-bottom:1px solid var(--gray-200); padding:12px; text-align:center; }
        table.completion-table th { background:var(--gray-50); color:var(--gray-600); font-weight:600; }
        .badge { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; font-weight:600; }
        .res-PASS { background:var(--color-success-bg); color:var(--color-success); }
        .res-FAIL { background:var(--color-danger-bg); color:var(--color-danger); }
        .res-PENDING { background:#e2e3e5; color:#383d41; }
        .cs-CONFIRMED { background:#cfe2ff; color:#084298; }
        .cs-EXPECTED { background:var(--color-warning-bg); color:var(--color-warning); }
        .cs-PENDING { background:#e2e3e5; color:#383d41; }
        .empty-state { color:var(--gray-500); font-size:15px; padding:40px 0; text-align:center; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/trainee :: header('attendance')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap">
                <h2>이수관리</h2>
            </div>
        </section>

        <section class="main-content main-wrap">
            <p class="page-desc" style="color:var(--gray-500); margin-bottom:20px;">
                수강 과정의 이수 여부를 확인하고, 이수 확정된 과정은 이수증을 내려받을 수 있어요.
            </p>


            <div class="empty-state" th:if="${completions == null or completions.isEmpty()}">
                <p>표시할 이수 정보가 없어요.</p>
                <p style="font-size:13px;">과정 이수 판정이 완료되면 여기에 표시됩니다.</p>
            </div>

            <div class="table-wrap" th:unless="${completions == null or completions.isEmpty()}">
                <table class="basic-table completion-table">
                    <thead>
                        <tr>
                            <th style="width:70px;">번호</th>
                            <th>과정명/기수</th>
                            <th style="width:110px;">진도율(%)</th>
                            <th style="width:110px;">출결률(%)</th>
                            <th style="width:110px;">이수상태</th>
                            <th style="width:120px;">이수확정상태</th>
                            <th style="width:130px;">확정일자</th>
                            <th style="width:130px;">이수증</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row, i : ${completions}">
                            <td th:text="${i.count}">1</td>
                            <td th:text="${row.courseLabel}">과정명/기수</td>
                            <td th:text="${row.progressRate}">0</td>
                            <td th:text="${row.attendanceRate}">0</td>
                            <td><span class="badge" th:classappend="'res-' + ${row.result}" th:text="${row.resultLabel}">상태</span></td>
                            <td><span class="badge" th:classappend="'cs-' + ${row.confirmStatus}" th:text="${row.confirmStatusLabel}">확정</span></td>
                            <td th:text="${row.confirmedAt != null ? #temporals.format(row.confirmedAt, 'yyyy-MM-dd') : '-'}">-</td>
                            <td>
                                <a th:if="${row.certificateIssuable}" class="btn btn-secondary"
                                   th:href="@{/trainee/completion-management/{id}/certificate(id=${row.id})}"
                                   target="_blank">이수증 다운로드</a>
                                <span th:unless="${row.certificateIssuable}" style="color:var(--gray-500);">-</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
