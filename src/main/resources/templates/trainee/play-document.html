<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title th:text="${content.title} + ' - 학습 콘텐츠'">수업 콘텐츠</title>
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/font-style.css">
    <link rel="stylesheet" href="/static/css/play-document.css">
    <link rel="stylesheet" href="/static/css/play.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-user-role="trainee">
    <header th:replace="~{fragments/trainee :: header('contents')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap flex-between">
                <h2>학습 콘텐츠 &gt; 이론 학습(문서)</h2>
            </div>
        </section>
        <section class="main-content">
            <section class="main-content-inner main-wrap">
                <div class="content-header">
                    <div class="content-breadcrumb">
                        <div class="breadcrumb-item">
                            <span class="breadcrumb-label">과정명</span>
                            <span class="breadcrumb-value" th:text="${content.courseName}">과정명</span>
                        </div>
                        <span class="breadcrumb-separator" th:if="${content.sessionName != null}">›</span>
                        <div class="breadcrumb-item" th:if="${content.sessionName != null}">
                            <span class="breadcrumb-label">차시</span>
                            <span class="breadcrumb-value" th:text="${content.sessionName}">차시명</span>
                        </div>
                        <span class="breadcrumb-separator">›</span>
                        <div class="breadcrumb-item">
                            <span class="breadcrumb-label">콘텐츠명</span>
                            <span class="breadcrumb-value" th:text="${content.title}">콘텐츠명</span>
                        </div>
                    </div>
                    <span>문서<span th:if="${content.durationLabel != '-'}" th:text="' / ' + ${content.durationLabel}"></span></span>
                </div>

                <div class="content-container"
                     th:attr="data-content-id=${content.id},
                              data-file-url=${content.fileUrl},
                              data-page-count=${content.pageCount != null ? content.pageCount : 0},
                              data-resume-page=${progress.maxPageReached != null ? progress.maxPageReached : 0}">
                    <div class="document-viewer">
                        <div class="document-controls">
                            <div class="nav-buttons">
                                <button class="nav-btn" id="prevBtn" onclick="previousPage()">&lt; 이전</button>
                                <button class="nav-btn" id="nextBtn" onclick="nextPage()">다음 &gt;</button>
                                <button class="btn btn-gray" onclick="firstPage()">처음으로</button>
                            </div>
                            <div class="page-info">
                                <span class="current-pages" id="currentPages">1 / 1</span>
                                <span class="progress-info">진행률: <span id="progressPercent">0</span>%</span>
                                <span class="max-page-reached">최대 진행: <span id="maxPageReached">0</span>페이지</span>
                            </div>
                        </div>
                        <div class="pages-container" id="pagesContainer">
                            <div class="loading-message">문서를 불러오는 중...</div>
                        </div>
                        <div class="button-container" style="margin-top:20px; text-align:center;">
                            <button id="saveExitBtn" class="big-btn btn-secondary" data-user-role="trainee">학습진도 저장하고 나가기</button>
                        </div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script th:inline="none">
    (function () {
        var container = document.querySelector('.content-container');
        if (!container) return;
        var contentId = container.getAttribute('data-content-id');
        var fileUrl = container.getAttribute('data-file-url');
        var declaredPages = parseInt(container.getAttribute('data-page-count') || '0', 10);
        var resumePage = parseInt(container.getAttribute('data-resume-page') || '0', 10);
        var csrfToken = (document.querySelector('meta[name="_csrf"]') || {}).content;
        var csrfHeader = (document.querySelector('meta[name="_csrf_header"]') || {}).content;
        // 예시 콘텐츠는 진도를 저장하지 않는다 — 서버도 막지만, 굳이 요청을 보낼 이유가 없다.
        var isSample = container.getAttribute('data-sample') === 'true';

        var pagesContainer = document.getElementById('pagesContainer');
        var currentPage = 1, totalPages = 0, maxReached = 0, pdfDoc = null;
        var isPdf = fileUrl && fileUrl.toLowerCase().indexOf('.pdf') !== -1;

        function postProgress() {
            if (isSample || !contentId) return Promise.resolve();
            var headers = { 'Content-Type': 'application/json' };
            if (csrfHeader) headers[csrfHeader] = csrfToken;
            return fetch('/trainee/contents/' + contentId + '/progress', {
                method: 'POST', headers: headers,
                body: JSON.stringify({ pageReached: maxReached, totalPages: totalPages })
            }).then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) { if (d) document.getElementById('progressPercent').textContent = d.progressRate; })
              .catch(function () {});
        }

        function updateInfo() {
            document.getElementById('currentPages').textContent = currentPage + ' / ' + totalPages;
            document.getElementById('maxPageReached').textContent = maxReached;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            if (totalPages > 0) {
                document.getElementById('progressPercent').textContent = Math.round(maxReached * 100 / totalPages);
            }
        }

        function touchMax() {
            if (currentPage > maxReached) { maxReached = currentPage; postProgress(); }
        }

        async function renderPdfPage(num) {
            pagesContainer.innerHTML = '';
            var page = await pdfDoc.getPage(num);
            var viewport = page.getViewport({ scale: 1.5 });
            var canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            canvas.width = viewport.width; canvas.height = viewport.height;
            var wrap = document.createElement('div');
            wrap.className = 'document-page';
            wrap.appendChild(canvas);
            pagesContainer.appendChild(wrap);
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            touchMax(); updateInfo();
        }

        window.nextPage = function () { if (currentPage < totalPages) { currentPage++; go(); } };
        window.previousPage = function () { if (currentPage > 1) { currentPage--; go(); } };
        window.firstPage = function () { currentPage = 1; go(); };
        window.setViewMode = function () { /* 단일 페이지 모드 */ };

        function go() { if (isPdf) renderPdfPage(currentPage); }

        if (isPdf && window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            pdfjsLib.getDocument(fileUrl).promise.then(function (doc) {
                pdfDoc = doc; totalPages = doc.numPages;
                currentPage = (resumePage > 0 && resumePage <= totalPages) ? resumePage : 1;
                maxReached = resumePage;
                renderPdfPage(currentPage);
            }).catch(function () {
                pagesContainer.innerHTML = '<div class="loading-message">문서를 불러올 수 없습니다.</div>';
            });
        } else if (fileUrl) {
            // 이미지 등 단일 페이지 문서 → 열람 시 완료
            totalPages = declaredPages > 0 ? declaredPages : 1;
            currentPage = 1; maxReached = totalPages;
            if (isSample) {
                // 예시는 저장된 진도를 그대로 보여준다 — 열자마자 100% 로 바뀌면
                // 목록 화면의 진도율과 어긋난 화면이 캡처된다.
                currentPage = resumePage > 0 ? resumePage : 1;
                maxReached = resumePage;
            }
            pagesContainer.innerHTML = '<div class="document-page"><img src="' + fileUrl +
                '" alt="문서" style="max-width:100%; border-radius:8px;"></div>';
            updateInfo(); postProgress();
        }

        document.getElementById('saveExitBtn').addEventListener('click', function () {
            Promise.resolve(postProgress()).then(function () { window.location.href = '/trainee/learning'; });
        });
        window.addEventListener('beforeunload', postProgress);
    })();
    </script>
</body>
</html>
