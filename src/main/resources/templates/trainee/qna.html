    <!DOCTYPE html>
    <html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 공통 -->
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css" />
    <link rel="stylesheet" href="/static/css/btn-style.css" />
    <link rel="stylesheet" href="/static/css/chatbot.css"/>
    <script src="/static/js/chatbot.js" defer></script>
    <link rel="stylesheet" href="/static/css/trainee/qna.css" />
    <script src="/static/js/trainee/qna.js?v=20260826-1" defer></script>

    <!-- 공지 전용(추가) -->
    <title>Samsung Academy LXP</title>
    </head>
<!-- ********************************************************************************************************* -->
<body>
    <header th:replace="~{fragments/trainee :: header('support')}"></header>
    <!-- 메인 컨텐츠 ********************************************************************************************************* -->
    <main>
        <section class="main-content-top">
        <div class="main-wrap">
            <h2>QnA</h2>
        </div>
        </section>

        <!-- QnA (한 페이지 구성: 리스트 + 질문하기 모달 + 상세 모달) -->
        <div class="qna-page main-wrap">

        <!-- Header -->
        <div class="qna-header">
            <div>
            <p class="qna-desc">학습 중 궁금한 점을 남기면 담당자가 답변해요.</p>
            </div>
            <button type="button" class="btn btn-primary" id="btnOpenAsk">질문하기 +</button>
        </div>

        <!-- Filters -->
        <form class="qna-filters" method="get" th:action="@{/trainee/qna}">
            <div class="filter-row">
                <div class="field field-grow">
                    <label for="fKeyword">검색</label>
                    <!-- 질문 본문(content)은 AES-256 암호문으로 저장돼 LIKE 검색이 불가능하다. 제목만 검색된다. -->
                    <input id="fKeyword" name="keyword" type="text" th:value="${keyword}" placeholder="제목에서 검색" />
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn btn-secondary" id="btnSearch">검색하기</button>
                    <a class="btn btn-gray" id="btnReset" th:href="@{/trainee/qna}">초기화</a>
                </div>
            </div>

        </form>

        <div class="filter-hint" id="filterHint" th:text="|전체 ${#lists.size(rows)}건|">전체 0건</div>
        <div class="alert" th:if="${message}" th:text="${message}" style="margin-bottom:10px;">질문을 등록했습니다.</div>

        <!-- Table -->
        <div class="qna-table-wrap">
            <table class="qna-table">
                <thead>
                    <tr>
                    <th style="width:72px;">번호</th>
                    <th>제목</th>
                    <th style="width:120px;">작성일</th>
                    <th style="width:80px;">조회</th>
                    </tr>
                </thead>
                <tbody id="qnaTbody">
                    <!-- 목록 DTO(QnaListRow)에는 content 가 없다 — 암호화 대상이라 목록 HTML 로 내보내지 않는다. -->
                    <tr th:each="row, iter : ${rows}"
                        th:attr="data-item-id=${row.id},data-status=${row.statusCode},data-category=${row.categoryLabel}">
                        <td th:text="${#lists.size(rows) - iter.index}">24</td>
                        <td>
                            <span class="status-badge" th:classappend="${row.statusClass}" th:text="${row.statusLabel}">답변완료</span>
                            <a th:href="@{/trainee/qna/{id}(id=${row.id})}" class="title-link"
                               th:attr="data-open-detail=${row.id}" th:text="${row.title}">
                                for문 조건이 헷갈려요
                            </a>
                            <!-- 비밀글일시 자물쇠 -->
                            <svg th:if="${row.secret}" xmlns="http://www.w3.org/2000/svg"
                                height="16px"
                                viewBox="0 -960 960 960"
                                width="16px"
                                fill="#949494">
                            <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm120-480h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/>
                            </svg>
                        </td>
                        <td th:text="${row.createdAt}">2026-01-25</td>
                        <td th:text="${row.viewCount}">18</td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="4" style="text-align:center; color:var(--gray-500);">등록한 질문이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="qna-pagination" id="pagination"></div>
        </div>


        <!-- =========================
            질문하기 모달 (한 페이지 내)
        ========================= -->
        <div class="modal-backdrop" id="askModal" aria-hidden="true">
        <!--
          id(aVisibility/aTitle/aBody)는 기존 JS(static/js/trainee/qna.js)가 getElementById 로 쓰므로 유지하고,
          name 만 QnaForm 필드(camelCase)에 맞춘다 — CLAUDE.md 전환 규칙.
        -->
        <form class="modal" role="dialog" aria-modal="true" aria-labelledby="askTitle"
              id="askForm" method="post" th:action="@{/trainee/qna}">
            <div class="modal-head">
            <h3 id="askTitle">질문하기</h3>
            <button type="button" class="icon-btn" data-close="askModal" aria-label="닫기">✕</button>
            </div>

            <div class="modal-body">
            <div class="grid">
                <div class="field">
                    <label for="aVisibility">공개 범위</label>
                    <select id="aVisibility" name="visibility">
                        <option value="course" selected >과정공유</option>
                        <option value="private">나만보기</option>
                    </select>
                </div>

                <div class="field">
                    <label for="aCategory">유형</label>
                    <select id="aCategory" name="category">
                        <option value="LECTURE">수업</option>
                        <option value="PROGRESS">진도</option>
                        <option value="ETC">기타</option>
                    </select>
                </div>

                <div class="field col-2">
                    <label for="aTitle">제목 <span class="req">*</span></label>
                    <input id="aTitle" type="text" name="title" th:value="${form.title}" placeholder="질문 제목을 입력하세요" maxlength="80" />
                </div>

                <div class="field col-2">
                    <label for="aBody">내용 <span class="req">*</span></label>
                    <!-- 저장 시 AES-256 컨버터로 암호화된다 (Qna.content) -->
                    <textarea id="aBody" rows="6" name="content" th:text="${form.content}" placeholder="상황/오류 메시지/기대한 결과 등을 자세히 적어주세요."></textarea>
                </div>
            </div>

            <div class="alert" id="askError" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            </div>

            <div class="modal-foot">
            <button type="button" class="btn btn-outline" data-close="askModal">취소</button>
            <button type="submit" class="btn btn-primary" id="btnSubmitAsk">등록</button>
            </div>
        </form>
        </div>
        <!-- 플로팅 메뉴 (AI 챗봇) -->
        <div class="floating-chatbot-btn" id="floatingChatbotBtn">
            <img src="/static/img/chatbot.png" alt="AI 헬피 챗봇">
            <span class="chatbot-hint">AI 헬피 챗봇</span>
        </div>

        <!-- Floating Chatbot Window -->
        <div class="floating-chatbot-window" id="floatingChatbotWindow" style="display:none;">
            <div class="chatbot-header">
                <span>AI 헬피 챗봇</span>
                <button class="chatbot-close-btn" id="chatbotCloseBtn" title="닫기">×</button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="chatbot-msg chatbot-msg-bot">안녕하세요! 무엇을 도와드릴까요?</div>
            </div>
            <div class="chatbot-badge-row" style="padding-left: 15px; display:flex; gap:7px; flex-wrap:wrap;background-color: #f7faff;">
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">출결 확인</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">과제 마감</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">시험 일정</span>
                <span class="chatbot-badge" style="display:inline-block; color:#638ECB; border:1.2px solid #b1cfef; border-radius:12px; font-size:13px; padding:4px 6px; cursor:pointer; box-shadow:0 1.5px 6px rgba(30,40,60,0.07);">Q&A 문의</span>
            </div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbotInput" class="chatbot-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                <button id="chatbotSendBtn" class="chatbot-send-btn">전송</button>
            </div>
        </div>
        </main>
        	<!-- 푸터 ********************************************************************************************************* -->
		<footer th:replace="~{fragments/trainee :: footer}"></footer>
<style>
    /* ===== simple footer ===== */
.simple-footer{

  padding:14px 18px;
  border-top:1px solid var(--gray-200);
  background:#fff;
  position: relative;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--gray-500);
  font-weight:700;
}

.footer-link{
  color:var(--gray-500);
  text-decoration:none;
}
.footer-link:hover{
  text-decoration:underline;
}

.footer-dot{
  margin:0 6px;
  color:var(--gray-300);
}

@media (max-width:640px){
  .footer-inner{
    flex-direction:column;
    gap:6px;
  }
}

</style>
	
        </body>


</html>
