<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/basic-form-trainee.css">
    <link rel="stylesheet" href="/static/css/btn-style.css">
    <link rel="stylesheet" href="/static/css/trainee/attendance.css">
    <title>Samsung Academy LXP - 출결현황</title>
    <style>
        .course-block { margin-bottom:28px; }
        .course-block h3 { font-size:16px; font-weight:700; margin:0 0 10px; display:flex; align-items:center; gap:12px; }
        .rate-pill { font-size:13px; font-weight:700; color:#1c3d6e; background:#eef3fb; border:1px solid #cdd9ee; border-radius:12px; padding:3px 12px; }
        table.att-table { border-collapse:collapse; width:100%; font-size:14px; }
        table.att-table th, table.att-table td { border-bottom:1px solid var(--gray-200); padding:10px 12px; text-align:center; }
        table.att-table th { background:var(--gray-50); color:var(--gray-600); font-weight:600; }
        .att-badge { display:inline-block; min-width:52px; padding:3px 10px; border-radius:10px; font-size:12px; font-weight:600; }
        .att-PRESENT { background:var(--color-success-bg); color:var(--color-success); }
        .att-LATE    { background:var(--color-warning-bg); color:var(--color-warning); }
        .att-ABSENT  { background:var(--color-danger-bg); color:var(--color-danger); }
        .att-EXCUSED { background:#e2e3ff; color:#3730a3; }
        .empty-state { color:var(--gray-500); font-size:15px; padding:40px 0; text-align:center; }
    </style>
</head>
<body>
    <header th:replace="~{fragments/trainee :: header('attendance')}"></header>

    <main>
        <section class="main-content-top">
            <div class="main-wrap">
                <h2>출결현황</h2>
            </div>
        </section>

        <section class="main-wrap">
            <p class="page-desc" style="color:var(--gray-500); margin-bottom:20px;">
                온라인 학습 접속 기준으로 산정된 나의 차시별 출결 상태입니다.
            </p>


            <div class="empty-state" th:if="${courses == null or courses.isEmpty()}">
                <p>표시할 출결 데이터가 없어요.</p>
                <p style="font-size:13px;">수강 중인 과정의 일정이 시작되면 출결이 산정됩니다.</p>
            </div>

            <div class="course-block" th:each="course : ${courses}">
                <h3>
                    <span th:text="${course.courseLabel}">과정명 / 기수</span>
                    <span class="rate-pill" th:text="|출석률 ${course.attendanceRate}%|">출석률 0%</span>
                </h3>
                <table class="att-table">
                    <thead>
                        <tr>
                            <th style="width:100px;">차시</th>
                            <th>차시명</th>
                            <th style="width:160px;">일자</th>
                            <th style="width:120px;">출결상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${course.rows}">
                            <td th:text="|${row.seq}차시|">1차시</td>
                            <td th:text="${row.sessionName}">차시명</td>
                            <td th:text="${row.date != null ? #temporals.format(row.date, 'yyyy-MM-dd') : '-'}">-</td>
                            <td><span class="att-badge" th:classappend="'att-' + ${row.status}" th:text="${row.label}">상태</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/trainee :: footer}"></footer>
</body>
</html>
