<!doctype html>
<!-- v2 프로토타입 로그인 화면은 실제 LXP 로그인으로 대체됐다.
     로그인 화면 내용은 templates/01-login/login.html 이 담당한다 — 여기서 다시 그리지 않는다.
     이 파일은 옛 링크(/v2/login/index.html)가 끊기지 않도록 남겨 둔 전달용이다.
     앱이 서빙하면 /login 상대경로, Cloudflare 정적 배포면 운영 절대주소로 보낸다. -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수강생 로그인</title><link rel="canonical" href="/login"><meta name="robots" content="noindex"><link rel="stylesheet" href="/v2/assets/tokens.css"><link rel="stylesheet" href="/v2/assets/base.css"><script src="/v2/assets/brand.js"></script><script>location.replace(window.BRAND.lxpLogin)</script></head>
<body><main style="min-height:60vh;display:grid;place-items:center;text-align:center;padding:2rem"><p>수강생 로그인 화면으로 이동합니다.<br>자동으로 넘어가지 않으면 <a href="/login" data-brand-href="lxpLogin">여기를 눌러 주세요</a>.</p></main><script>applyBrand()</script></body></html>
