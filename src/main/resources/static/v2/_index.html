<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 인덱스 — {brand} 통합 플랫폼</title>
<link rel="stylesheet" href="/v2/assets/tokens.css">
<link rel="stylesheet" href="/v2/assets/base.css">
<link rel="stylesheet" href="/v2/assets/components.css">
</head>
<body>

<div class="container container--app" style="padding-block:var(--sp-10)">

  <header class="page__head">
    <span class="eyebrow">SCREEN INDEX</span>
    <h1><span data-brand="name"></span> 통합 플랫폼 — 화면 구성</h1>
    <p class="lead">
      공개사이트 3종 · LXP 수강생 · 통합 관리자(3단계 권한)의 전체 화면 목록입니다.
      각 화면이 어떤 요구 기능ID를 담는지 함께 표기했습니다.
    </p>
  </header>

  <!-- 진행 요약 -->
  <div class="grid grid-4" id="summary" style="margin-bottom:var(--sp-6)"></div>

  <div class="card card--pad" style="margin-bottom:var(--sp-8)">
    <div class="progress-label"><span>전체 진행</span><span id="pct" class="num">0%</span></div>
    <div class="progress" style="height:10px"><div class="progress__bar" id="bar" style="width:0%"></div></div>
    <p class="hint" style="margin-top:var(--sp-3)">
      상태가 비어 있는 행은 아직 제작 전입니다. 완료로 표기된 화면만 실제로 열립니다.
      <b>화면이 있다고 기능 구현이 끝난 것은 아닙니다</b> — 구현 여부는 구현확인표 회신본을 기준으로 합니다.
    </p>
  </div>

  <!-- 필터 -->
  <div class="filterbar" style="margin-bottom:var(--sp-6)">
    <label class="label sr-only" for="q">검색</label>
    <input class="input" id="q" type="search" placeholder="화면명·기능ID 검색 (예: 감독, LXP-018, 몰입-030)" style="min-width:300px;flex:1">
    <div class="btn-group" role="group" aria-label="우선순위 필터">
      <button class="pill pill--active" data-pri="">전체</button>
      <button class="pill" data-pri="P0">P0</button>
      <button class="pill" data-pri="P1">P1</button>
      <button class="pill" data-pri="P2">P2</button>
    </div>
    <label class="check"><input type="checkbox" id="onlyDone"> 완료만</label>
  </div>

  <div id="groups"></div>

  <p class="hint" style="margin-top:var(--sp-10)">
    원본 목록: <code>docs/redesign/screen-inventory.csv</code> (이 페이지는 같은 파일을 읽습니다)
  </p>
</div>

<script src="/v2/assets/brand.js"></script>
<script>
(function () {
  "use strict";

  /* 아주 단순한 CSV 파서 — 따옴표 없는 필드만 쓰는 파일이라 이걸로 충분하다 */
  function parseCsv(text) {
    var lines = text.replace(/^﻿/, "").trim().split(/\r?\n/);
    var head = lines.shift().split(",");
    return lines.filter(Boolean).map(function (line) {
      var cells = line.split(",");
      var row = {};
      head.forEach(function (h, i) { row[h.trim()] = (cells[i] || "").trim(); });
      return row;
    });
  }

  var ALL = [];
  var state = { q: "", pri: "", done: false };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function priBadge(p) {
    var cls = p === "P0" ? "badge--risk" : p === "P1" ? "badge--warn" : "";
    return '<span class="badge ' + cls + '">' + esc(p) + "</span>";
  }

  function render() {
    var rows = ALL.filter(function (r) {
      if (state.pri && r["우선순위"] !== state.pri) return false;
      if (state.done && r["상태"] !== "완료") return false;
      if (state.q) {
        var hay = (r["화면명"] + " " + r["담는 기능ID"] + " " + r["화면ID"] + " " + r["영역"]).toLowerCase();
        if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;
    });

    // 영역별 그룹
    var order = [], byArea = {};
    rows.forEach(function (r) {
      if (!byArea[r["영역"]]) { byArea[r["영역"]] = []; order.push(r["영역"]); }
      byArea[r["영역"]].push(r);
    });

    document.getElementById("groups").innerHTML = order.map(function (area) {
      var items = byArea[area];
      var doneN = items.filter(function (r) { return r["상태"] === "완료"; }).length;
      return '<section class="card" style="margin-bottom:var(--sp-6)">' +
        '<div class="card__head"><p class="card__title">' + esc(area) + "</p>" +
          '<span class="badge" style="margin-left:auto">' + doneN + " / " + items.length + " 완료</span></div>" +
        '<div class="table-wrap"><table class="table"><thead><tr>' +
          '<th scope="col" style="width:88px">화면ID</th><th scope="col">화면명</th>' +
          '<th scope="col">담는 기능ID</th><th scope="col" style="width:72px">우선</th>' +
          '<th scope="col" style="width:96px">상태</th></tr></thead><tbody>' +
        items.map(function (r) {
          var done = r["상태"] === "완료";
          return "<tr>" +
            "<td><code class='xsmall'>" + esc(r["화면ID"]) + "</code></td>" +
            "<td>" + (done
              ? '<a href="' + esc(r["경로"]) + '"><b>' + esc(r["화면명"]) + "</b></a>"
              : '<span class="muted">' + esc(r["화면명"]) + "</span>") +
              '<p class="xsmall subtle">' + esc(r["경로"]) + "</p></td>" +
            '<td class="xsmall muted">' + esc(r["담는 기능ID"]) + "</td>" +
            "<td>" + priBadge(r["우선순위"]) + "</td>" +
            "<td>" + (done
              ? '<span class="badge badge--ok">완료</span>'
              : '<span class="badge">' + esc(r["제작일"] || "예정") + "</span>") + "</td>" +
          "</tr>";
        }).join("") +
        "</tbody></table></div></section>";
    }).join("") || '<div class="empty"><p class="empty__title">조건에 맞는 화면이 없습니다</p></div>';
  }

  function summary() {
    var total = ALL.length;
    var done = ALL.filter(function (r) { return r["상태"] === "완료"; }).length;
    var p0 = ALL.filter(function (r) { return r["우선순위"] === "P0"; });
    var p0done = p0.filter(function (r) { return r["상태"] === "완료"; }).length;

    // 담는 기능ID 를 펼쳐 커버되는 기능 수를 센다 (범위표기 LXP-001~005 는 1건으로 계산)
    var feat = {};
    ALL.forEach(function (r) {
      (r["담는 기능ID"] || "").split(/\s+/).forEach(function (f) {
        if (/^(공통|취업|몰입|비즈|LXP)-/.test(f)) feat[f] = true;
      });
    });

    document.getElementById("summary").innerHTML =
      '<div class="kpi"><p class="kpi__label">전체 화면</p><p class="kpi__value">' + total + '<small>개</small></p></div>' +
      '<div class="kpi"><p class="kpi__label">제작 완료</p><p class="kpi__value">' + done + '<small>개</small></p>' +
        '<p class="kpi__delta kpi__delta--flat">남은 ' + (total - done) + "개</p></div>" +
      '<div class="kpi kpi--attn"><p class="kpi__label">P0 (반드시)</p><p class="kpi__value">' + p0done + " / " + p0.length + "</p></div>" +
      '<div class="kpi"><p class="kpi__label">매핑된 기능ID</p><p class="kpi__value">' + Object.keys(feat).length + '<small>종</small></p>' +
        '<p class="kpi__delta kpi__delta--flat">범위표기 포함</p></div>';

    var pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("bar").style.width = pct + "%";
  }

  fetch("/v2/assets/inventory.csv")
    .then(function (r) { return r.text(); })
    .then(function (t) { ALL = parseCsv(t); summary(); render(); })
    .catch(function () {
      document.getElementById("groups").innerHTML =
        '<div class="notice-box notice-box--risk">inventory.csv 를 불러오지 못했습니다. ' +
        'file:// 로 열면 차단되니 서버(예: http://localhost:8080/v2/_index.html)로 여세요.</div>';
    });

  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.getElementById("onlyDone").addEventListener("change", function (e) { state.done = e.target.checked; render(); });
  document.querySelectorAll("[data-pri]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.pri = b.dataset.pri;
      document.querySelectorAll("[data-pri]").forEach(function (x) { x.classList.toggle("pill--active", x === b); });
      render();
    });
  });

  window.applyBrand();
})();
</script>
</body>
</html>
