<!doctype html>
<!-- 라이브 강의 모니터링 데모 — LXP-125/127 프론트엔드 부분 구현.
     운영 admin-evaluation-monitoring-live.html 확장 화면과 같은 문법(검색·요약·타일·표)을
     쓰지만, 참가자·장치·이벤트는 전부 모의 데이터다. 실제 스트림은 없다.

     페이지 루트 클래스 .live-monitor-page 는 <body> 에 붙는다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/css/common-style.css">
<link rel="stylesheet" href="/static/css/sidebar-style.css">
<link rel="stylesheet" href="/static/css/btn-style.css">
<link rel="stylesheet" href="/v2/assets/live-class.css">
<title>Samsung Academy LXP - 관리자 — 라이브 강의 모니터링</title>
</head>
<body class="live-monitor-page">

<main class="main-content">

  <p class="demo-flash">
    이 화면의 모든 참가자·장치·이벤트는 <b>모의 데이터(데모)</b>입니다. 실제 스트림이 연결되어 있지 않으며,
    안내 발송도 이 브라우저의 이벤트 로그에만 기록됩니다.
  </p>

  <div class="search-container">
    <label class="sr-only" for="peopleSearch">참가자 검색</label>
    <input type="search" id="peopleSearch" placeholder="이름 또는 좌석번호 검색">

    <label class="sr-only" for="stateFilter">상태 필터</label>
    <select id="stateFilter">
      <option value="all">상태 전체</option>
      <option value="ok">정상</option>
      <option value="warn">주의</option>
      <option value="offline">연결 끊김</option>
    </select>

    <label class="sr-only" for="scenarioSelect">상태 시나리오(데모)</label>
    <select id="scenarioSelect"></select>
  </div>

  <div class="monitor-summary">
    <span>강의: <strong id="sessionTitle"></strong></span>
    <span id="sessionMeta"></span>
    <span class="sep" aria-hidden="true"></span>
    <span>전체 <strong id="kpiTotal">0</strong></span>
    <span>정상 <strong id="kpiOk">0</strong></span>
    <span>주의 <strong id="kpiWarn">0</strong></span>
    <span>끊김 <strong id="kpiOffline">0</strong></span>
  </div>
  <p class="hint-text mb-12" id="filterCount" aria-live="polite"></p>

  <div class="admin-card">
    <div class="row-between mb-12">
      <div>
        <h3 id="selName">참가자를 선택하세요</h3>
        <p class="hint-text" id="selMeta"></p>
      </div>
      <button type="button" class="btn btn-secondary" id="noticeBtn" disabled>안내 보내기</button>
    </div>

    <div class="device-tiles">
      <div class="device-tile">
        <p class="tile-empty">실제 스트림 없음</p>
        <span class="tile-label">카메라</span>
        <span class="state-badge" data-role="camera-badge">-</span>
      </div>
      <div class="device-tile">
        <p class="tile-empty">실제 스트림 없음</p>
        <span class="tile-label">마이크</span>
        <span class="state-badge" data-role="mic-badge">-</span>
      </div>
      <div class="device-tile">
        <p class="tile-empty">실제 스트림 없음</p>
        <span class="tile-label">화면 공유</span>
        <span class="state-badge" data-role="screen-badge">-</span>
      </div>
    </div>
  </div>

  <div class="admin-card">
    <h3>참가자 목록</h3>
    <div class="table-scroll">
      <table class="people-table">
        <thead><tr><th>이름</th><th>좌석</th><th>역할</th><th>상태</th></tr></thead>
        <tbody id="peopleBody"></tbody>
      </table>
    </div>
  </div>

  <div class="admin-card">
    <h3>최근 데모 이벤트</h3>
    <div class="table-scroll">
      <table class="people-table">
        <thead><tr><th>시각</th><th>참가자</th><th>유형</th><th>심각도</th><th>내용</th></tr></thead>
        <tbody id="eventBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="/v2/assets/exam-legacy-shell.js"></script>
<script src="/v2/assets/live-class-common.js"></script>
<script src="/v2/assets/live-class-demo-data.js"></script>
<script src="/v2/assets/live-class-monitor.js"></script>
<script>ExamShell.admin({ active: "courses", title: "과정/운영 관리 > 라이브 강의 모니터링" });</script>
</body>
</html>
