<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>나에게 맞는 과정 찾기 — {brand}</title>
  <link rel="stylesheet" href="/v2/assets/tokens.css">
  <link rel="stylesheet" href="/v2/assets/base.css">
  <link rel="stylesheet" href="/v2/assets/components.css?v=20260824-64">
  <link rel="stylesheet" href="/v2/assets/public-journey.css?v=20260824-64">
</head>
<body class="class-site recommend-page">
<main>
  <section class="recommend-shell">
    <div class="container">
      <span>COURSE MATCH</span>
      <h1>지금 상황에 맞는<br><em>과정부터 좁혀보세요.</em></h1>
      <p class="recommend-lead">다섯 가지 조건을 비교해 추천 과정과 이유를 먼저 보여드립니다.<br>결과를 확인한 뒤 같은 조건으로 상담을 이어갈 수 있습니다.</p>

      <form id="course-recommender">
        <div class="recommend-questions">
          <fieldset>
            <legend><small>01</small> 관심 직무</legend>
            <label><input type="radio" name="interest" value="data" required><span>데이터 분석·AI</span></label>
            <label><input type="radio" name="interest" value="factory"><span>스마트팩토리·AIoT</span></label>
            <label><input type="radio" name="interest" value="robot"><span>로봇·자율주행</span></label>
            <label><input type="radio" name="interest" value="cloud"><span>웹·클라우드 개발</span></label>
            <label><input type="radio" name="interest" value="creative"><span>디자인·콘텐츠</span></label>
            <label><input type="radio" name="interest" value="global"><span>글로벌·기획</span></label>
          </fieldset>
          <fieldset>
            <legend><small>02</small> 현재 수준</legend>
            <label><input type="radio" name="level" value="beginner" required><span>처음 시작</span></label>
            <label><input type="radio" name="level" value="basic"><span>기초 학습 경험</span></label>
            <label><input type="radio" name="level" value="project"><span>프로젝트 경험</span></label>
          </fieldset>
          <fieldset>
            <legend><small>03</small> 가능한 기간</legend>
            <label><input type="radio" name="duration" value="short" required><span>3개월 이내</span></label>
            <label><input type="radio" name="duration" value="medium"><span>4~6개월</span></label>
            <label><input type="radio" name="duration" value="long"><span>7개월 이상</span></label>
            <label><input type="radio" name="duration" value="any"><span>기간 상관없음</span></label>
          </fieldset>
          <fieldset>
            <legend><small>04</small> 숙식 필요</legend>
            <label><input type="radio" name="lodging" value="needed" required><span>필요해요</span></label>
            <label><input type="radio" name="lodging" value="not-needed"><span>필요 없어요</span></label>
            <label><input type="radio" name="lodging" value="undecided"><span>아직 모르겠어요</span></label>
          </fieldset>
          <fieldset class="recommend-question--wide">
            <legend><small>05</small> 현재 재직 상태</legend>
            <label><input type="radio" name="status" value="job" required><span>구직·취업 준비 중</span></label>
            <label><input type="radio" name="status" value="worker"><span>재직 중</span></label>
            <label><input type="radio" name="status" value="student"><span>일반고 3학년</span></label>
          </fieldset>
        </div>
        <div class="recommend-submit">
          <p>입력한 조건은 추천과 상담 연결에만 사용됩니다.</p>
          <button class="btn btn--primary btn--lg" type="submit">나에게 맞는 과정 보기</button>
        </div>
      </form>

      <section class="recommend-result" id="recommend-result" hidden aria-live="polite">
        <header class="recommend-result__head">
          <div><span>MATCHED COURSES</span><h2>이 조건이라면<br><em>이 과정부터 확인해 보세요.</em></h2></div>
          <dl id="recommend-profile"></dl>
        </header>
        <div class="recommend-result__grid" id="recommend-list"></div>
        <div class="recommend-result__footer">
          <p><strong>결정하기 어렵다면?</strong><br>추천 조건과 결과를 담당자가 그대로 확인하고 차이를 설명해 드립니다.</p>
          <a class="btn btn--primary btn--lg" id="recommend-general-counsel" href="/v2/site/campus/counsel.html?from=recommend">추천 결과로 상담받기</a>
        </div>
      </section>

    </div>
  </section>
</main>
<script src="/v2/assets/brand.js"></script>
<script src="/v2/assets/course-data.js"></script>
<script src="/v2/assets/course-recommend.js?v=20260823-57"></script>
<script src="/v2/assets/page-section-navigation.js"></script>
<script>Shell.site({service:'class',hideNavigator:true})</script>
</body>
</html>
